    (function () {
      var root = document.querySelector('[data-composition-id="29-claude-biet-ghi-nho"]');
      function q(sel) { return root.querySelector(sel); }

      // notebook lines: split each word into characters for a write-on
      var lines = [
        { el: q("#f29-t1"), text: "vai trò", t: 3.96 },
        { el: q("#f29-t2"), text: "dự án", t: 4.71 },
        { el: q("#f29-t3"), text: "phong cách", t: 5.63 }
      ];
      lines.forEach(function (ln) {
        Array.from(ln.text).forEach(function (c) {
          var s = document.createElement("span");
          s.className = "f29-ch";
          s.textContent = c === " " ? " " : c;
          ln.el.appendChild(s);
        });
      });

      // prompt text, typed word by word on the spoken times
      var typed = q("#f29-typed");
      var strike = q("#f29-strike");
      var words = [
        { w: "nhắc", t: 8.38 },
        { w: " lại", t: 8.57 },
        { w: " mỗi", t: 8.77 },
        { w: " lần", t: 8.93 }
      ];
      var tchars = [];
      words.forEach(function (wd) {
        Array.from(wd.w).forEach(function (c, i) {
          var s = document.createElement("span");
          s.className = "f29-tc";
          s.textContent = c === " " ? " " : c;
          typed.insertBefore(s, strike);
          tchars.push({ el: s, t: wd.t + i * 0.035 });
        });
      });

      // initial states (before the timeline is built)
      gsap.set(q("#f29-arrow path"), { strokeDasharray: "1 2", strokeDashoffset: 1 });
      gsap.set(q("#f29-phead-line path"), { strokeDasharray: "1 2", strokeDashoffset: 1 });
      gsap.set(q("#f29-link path"), { strokeDasharray: "1 2", strokeDashoffset: 1 });
      gsap.set(q("#f29-strike path"), { strokeDasharray: "1 2", strokeDashoffset: 1 });
      gsap.set(q("#f29-check path"), { strokeDasharray: "1 2", strokeDashoffset: 1 });
      gsap.set(".f29-dot", { scale: 0 });
      gsap.set(q("#f29-pen"), { x: 0, y: 0 });

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1: notebook (0 - 6.7) ----
      tl.fromTo(q("#f29-book"), { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(q("#f29-cframe"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.35);
      // slow camera push on the notebook through the whole scene
      tl.fromTo(q("#f29-shot1"), { scale: 1 }, { scale: 1.025, duration: 6.0, ease: "none", transformOrigin: "30% 50%" }, 0.7);

      // "bộ nhớ" lands on the cover with the spark

      tl.fromTo(q("#f29-cw2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.25);
      tl.fromTo(q("#f29-cspark"), { opacity: 0, scale: 0, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" }, 1.11);
      tl.fromTo(q("#f29-kick"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.8);

      // "sổ tay": the cover folds open to the left, label lands on the right
      tl.fromTo(q("#f29-cover"), { scaleX: 1, opacity: 1 }, { scaleX: 0, opacity: 0.4, duration: 0.6, ease: "power2.inOut" }, 2.32);
      tl.fromTo(q("#f29-lw1"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.32);
      tl.fromTo(q("#f29-lw2"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.54);
      tl.fromTo(q("#f29-lw3"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.72);
      tl.fromTo(q("#f29-lw4"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.86);
      tl.to(q("#f29-phead-line path"), { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 2.75);
      tl.to(q("#f29-arrow path"), { strokeDashoffset: 0, duration: 0.55, ease: "none" }, 3.0);

      // lines write themselves; newest terracotta, older ones cream
      var penX = [330, 260, 420];
      lines.forEach(function (ln, i) {
        var chs = ln.el.querySelectorAll(".f29-ch");
        var dot = q("#f29-dot" + (i + 1));
        tl.to(dot, { scale: 1, duration: 0.3, ease: "power3.out" }, ln.t);
        tl.set(ln.el, { color: "#D97757" }, ln.t);
        chs.forEach(function (c, k) {
          tl.fromTo(c, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, ln.t + k * 0.04);
        });
        if (i > 0) tl.set(lines[i - 1].el, { color: "#F0EEE6" }, ln.t);
      });
      // the spark rides along as the pen
      tl.fromTo(q("#f29-pen"), { opacity: 0, scale: 0, rotation: -20, x: 140 + penX[0], y: 238 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "power3.out" }, 3.96);
      tl.to(q("#f29-pen"), { x: 140 + penX[1], y: 378, rotation: 45, duration: 0.35, ease: "power2.inOut" }, 4.71);
      tl.to(q("#f29-pen"), { x: 140 + penX[2], y: 518, rotation: 90, duration: 0.35, ease: "power2.inOut" }, 5.63);

      // ---- cut: zoom-through from notebook to prompt bar (after "thích" 6.62) ----
      tl.to(q("#f29-shot1"), { opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.inOut" }, 6.7);
      tl.fromTo(q("#f29-shot2"), { opacity: 0, scale: 1.08, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, 6.8);

      // ---- Scene 2: prompt bar ----
      // "Nhờ vậy": memory chip links to the bar
      tl.fromTo(q("#f29-chip"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.22);
      tl.to(q("#f29-link path"), { strokeDashoffset: 0, duration: 0.4, ease: "none" }, 7.4);

      // blinking caret (deterministic toggles) while the bar is empty
      var caret = q("#f29-caret");
      var bt;
      for (bt = 7.2; bt < 8.35; bt += 0.5) {
        tl.set(caret, { opacity: 0 }, bt);
        tl.set(caret, { opacity: 1 }, bt + 0.25);
      }
      tl.set(caret, { opacity: 1 }, 8.37);

      // type "nhắc lại mỗi lần" on the spoken words
      tchars.forEach(function (tc) {
        tl.set(tc.el, { display: "inline-block" }, tc.t);
      });

      tl.to(q("#f29-strike path"), { strokeDashoffset: 0, duration: 0.22, ease: "none" }, 9.08);
      tl.to(strike, { opacity: 0, duration: 0.1, ease: "none" }, 9.34);

      for (var k = tchars.length - 1, n = 0; k >= 0; k--, n++) {
        tl.set(tchars[k].el, { display: "none" }, 9.38 + n * 0.014);
      }
