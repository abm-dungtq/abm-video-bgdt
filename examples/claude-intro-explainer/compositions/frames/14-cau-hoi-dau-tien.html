  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="14-cau-hoi-dau-tien"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      // eight-ray spark (generic asterisk), drawn in SVG
      var SPARK = '<svg viewBox="-50 -50 100 100"><g stroke="#D97757" stroke-width="11" stroke-linecap="round">' +
        '<line x1="0" y1="-44" x2="0" y2="44"/><line x1="-44" y1="0" x2="44" y2="0"/>' +
        '<line x1="-31" y1="-31" x2="31" y2="31"/><line x1="-31" y1="31" x2="31" y2="-31"/></g></svg>';
      qa('.f14-spk').forEach(function (el) { el.innerHTML = SPARK; });

      // typed request: each word types inside its own spoken window (audio_meta)
      var WORDS = [
        { host: '#f14-pre', text: 'Viết ', s: 1.878, e: 2.019 },
        { host: '#f14-hot-chars', text: 'email ', s: 2.602, e: 2.864 },
        { host: '#f14-hot-chars', text: 'cảm ', s: 2.924, e: 3.065 },
        { host: '#f14-hot-chars', text: 'ơn', s: 3.125, e: 3.205 },
        { host: '#f14-post', text: ' khách ', s: 3.215, e: 3.386 },
        { host: '#f14-post', text: 'hàng', s: 3.406, e: 3.607 }
      ];
      var typeSteps = [];
      WORDS.forEach(function (w) {
        var chars = Array.from(w.text.normalize('NFC'));
        var host = q(w.host);
        var step = (w.e - w.s) / chars.length;
        chars.forEach(function (c, i) {
          var sp = document.createElement('span');
          sp.className = 'f14-ch';
          sp.textContent = c;
          host.appendChild(sp);
          typeSteps.push({ el: sp, t: w.s + i * step });
        });
      });

      // initial hidden states (before the timeline is built)
      gsap.set('#f14-s3', { opacity: 0 });
      gsap.set(qa('.f14-bar-l'), { scaleX: 0, transformOrigin: '0% 50%' });

      var tl = gsap.timeline({ paused: true });
      var IN = 'power3.out';
      var draw = function (sel, t, d) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: 'none' }, t);
      };
      var word = function (sel, t) {
        tl.fromTo(sel, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: IN }, t);
      };

      // ---- Scene 1 (0–9.08): the prompt bar, a live caret, the request types itself
      tl.fromTo('#f14-bar', { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: IN }, 0.05);
      tl.fromTo('#f14-ask-kicker', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, 1.014);
      // caret blinks while idle, stays solid while typing
      [0.55, 1.05, 1.55].forEach(function (t) {
        tl.set('#f14-caret', { opacity: 0 }, t);
        tl.set('#f14-caret', { opacity: 1 }, t + 0.25);
      });
      typeSteps.forEach(function (s) { tl.set(s.el, { display: 'inline' }, s.t); });
      // "email cảm ơn" is terracotta as it types; the hand-drawn underline lands after "ơn"
      draw('#f14-hot-path', 3.22, 0.35);
      // send pressed
      tl.fromTo('#f14-send', { scale: 1 }, { scale: 0.86, duration: 0.12, ease: 'power2.in', immediateRender: false }, 3.72);
      tl.to('#f14-send', { scale: 1, duration: 0.25, ease: IN }, 3.87);
      tl.fromTo('#f14-send-fill', { opacity: 0 }, { opacity: 0.55, duration: 0.2, ease: IN }, 3.78);
      [4.1, 4.6, 5.1, 5.6, 6.1, 6.6, 7.1, 7.6, 8.1, 8.6].forEach(function (t) {
        tl.set('#f14-caret', { opacity: 0 }, t);
        tl.set('#f14-caret', { opacity: 1 }, t + 0.25);
      });
      // "chỉ vài giây sau": typing indicator where the draft will land
      qa('.f14-dot').forEach(function (d, i) {
        tl.fromTo(d, { opacity: 0, y: 0 }, { opacity: 1, y: -10, duration: 0.3, ease: 'power2.out' }, 4.25 + i * 0.15);
        tl.to(d, { y: 0, opacity: 0.4, duration: 0.3, ease: 'power2.in' }, 4.55 + i * 0.15);
        tl.to(d, { y: -10, opacity: 1, duration: 0.3, ease: 'power2.out' }, 5.0 + i * 0.15);
        tl.to(d, { y: 0, opacity: 0.4, duration: 0.3, ease: 'power2.in' }, 5.3 + i * 0.15);
        tl.to(d, { opacity: 0, duration: 0.2, ease: 'power2.in' }, 5.95);
      });
      // "bản nháp": the draft card slides into the right 40 %
      tl.fromTo('#f14-draft', { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: IN }, 6.12);
      tl.fromTo('#f14-kspark', { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: IN }, 6.2);
      qa('.f14-bar-l').forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: 'none' }, 6.35 + i * 0.16);
      });
      // "bạn đọc lại": a sage reading highlight runs down the lines
      tl.fromTo('#f14-scan', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IN }, 7.63);
      tl.fromTo('#f14-scan', { y: 0 }, { y: 248, duration: 0.9, ease: 'power1.inOut' }, 7.7);
      tl.to('#f14-scan', { opacity: 0, duration: 0.25, ease: 'power2.in' }, 8.6);

      // ---- Scene 2 (9.08–13.26): the draft moves top-centre, refinement chips rise
      tl.to('#f14-left', { y: -60, opacity: 0, filter: 'blur(8px)', duration: 0.4, ease: 'power2.in' }, 9.0);
      tl.to('#f14-draft', { x: -540, y: -120, scale: 0.85, transformOrigin: '50% 0%', duration: 0.6, ease: 'power2.inOut' }, 9.08);
      // "ngắn hơn" (left) — active chip, arrow back to the draft, the draft shortens
      tl.fromTo('#f14-chip1', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: IN }, 9.08);
      tl.set('#f14-chip1', { borderColor: '#D97757' }, 9.08);
      draw('#f14-ar1', 9.3, 0.3);
      draw('#f14-ar1h', 9.6, 0.1);
      tl.to(qa('.f14-bar-l'), { scaleX: 0.62, duration: 0.3, ease: 'power2.inOut' }, 9.32);
      // "trang trọng hơn" (right) — becomes the active chip
      tl.fromTo('#f14-chip2', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: IN }, 9.8);
      tl.set('#f14-chip1', { borderColor: 'rgba(154,150,140,.7)' }, 9.8);
      tl.set('#f14-chip2', { borderColor: '#D97757' }, 9.8);
      draw('#f14-ar2', 10.0, 0.3);
      draw('#f14-ar2h', 10.3, 0.1);
      // the draft's bars redraw once
      qa('.f14-bar-l').forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: 'none', immediateRender: false }, 10.19 + i * 0.12);
      });
      // quiet hold
      tl.fromTo('#f14-s12', { y: 0 }, { y: -8, duration: 2.5, ease: 'power1.inOut', immediateRender: false }, 10.75);

      // ---- Scene 3 (13.26–14.65): kinetic close, centred
      tl.to('#f14-s12', { scale: 1.06, opacity: 0, filter: 'blur(8px)', transformOrigin: '880px 400px', duration: 0.3, ease: 'power2.in' }, 13.26);
      tl.set('#f14-s3', { opacity: 1 }, 13.26);
      word('#f14-j1', 13.26);
      word('#f14-j2', 13.3);
      word('#f14-j3', 13.34);
      tl.fromTo('#f14-w1', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, 13.262);
      tl.fromTo('#f14-w2', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, 13.443);
      tl.fromTo('#f14-w3', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, 13.624);
      tl.set('#f14-w3', { color: '#D97757' }, 13.624);
      tl.fromTo('#f14-wspark', { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: IN }, 13.62);
      draw('#f14-under', 13.8, 0.5);

      tl.to({}, { duration: 14.646 }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["14-cau-hoi-dau-tien"] = tl;
    })();
