      // initial states (before the timeline is built)
      gsap.set('#f10-world', { transformOrigin: '0 0' });
      gsap.set('#f10-ring', { transformOrigin: '880px 430px' });
      gsap.set(['#f10-laptop', '#f10-monitor', '#f10-phone', '#f10-sync'], { transformOrigin: '50% 50%' });

      gsap.set('#f10-token', { xPercent: -50, yPercent: -50, x: 300, y: 430 });

      var tl = gsap.timeline({ paused: true });
      var IN = 'power3.out';

      labIn('#f10-l-and', 3.57);

      tl.to('#f10-spark1', { rotation: 180, duration: 0.28, ease: 'power2.inOut' }, 2.88);
      tl.to('#f10-spark1', { rotation: 270, duration: 0.24, ease: 'power2.inOut' }, 3.47);

      tl.fromTo('#f10-laptop', { x: 0, y: 0, scale: 1 }, { x: -120, y: 40, scale: 0.6, duration: 0.7, ease: 'power2.inOut' }, 5.36);
      tl.fromTo('#f10-monitor', { x: 0, y: 0, scale: 1 }, { x: -90, y: -225, scale: 0.6, duration: 0.7, ease: 'power2.inOut' }, 5.40);
      tl.fromTo('#f10-phone', { x: 0, y: 0, scale: 1 }, { x: 20, y: 40, scale: 0.6, duration: 0.7, ease: 'power2.inOut' }, 5.44);
      tl.fromTo('#f10-loop', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: 'none' }, 5.72);
      tl.fromTo('#f10-ah2', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'none' }, 5.82);

      tl.fromTo('#f10-token', { x: 300 }, { x: 880, duration: 0.45, ease: 'sine.in' }, 6.32);
      tl.fromTo('#f10-token', { y: 430 }, { y: 140, duration: 0.45, ease: 'sine.out' }, 6.32);
      tl.fromTo('#f10-token', { x: 880 }, { x: 1460, duration: 0.45, ease: 'sine.out' }, 6.771);
      tl.fromTo('#f10-token', { y: 140 }, { y: 430, duration: 0.45, ease: 'sine.in' }, 6.771);
      tl.to('#f10-token', { opacity: 0, scale: 0.6, duration: 0.2, ease: 'power2.in' }, 7.22);
