      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var spark1 = q('#f20-spark1');
      var TOTAL = path.getTotalLength();
      var ride = { p: 0 };
      function placeSpark() {
        var pt = path.getPointAtLength(TOTAL * ride.p);
        gsap.set(spark1, { x: pt.x - 20, y: pt.y - 20 });
      }

      // initial states (before the timeline is built)
      gsap.set('#f20-world', { transformOrigin: '0 0', x: 0 });

      gsap.set('#f20-arm', { transformOrigin: '0px 0px', rotation: 0 });
      gsap.set('#f20-spark2', { scale: 0, opacity: 0, transformOrigin: '50% 50%' });
      gsap.set('#f20-ring', { transformOrigin: '880px 440px' });
      gsap.set('#f20-d3', { svgOrigin: '638 580' });

      var tl = gsap.timeline({ paused: true });
      var IN = 'power3.out';
      var MOVE = 'power2.inOut';

      // ---- Scene 1: journey across the strip ----
      // station 1: the draft ("Câu trả lời đầu tiên")

      tl.fromTo('#f20-draft-label', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: IN }, 0.31);

      tl.to(path, { strokeDashoffset: 0, duration: 0.95, ease: 'none' }, 2.55);

      tl.fromTo('#f20-path-head', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'none' }, 3.45);

        tl.fromTo(c.id, { y: c.dy + 60, rotation: 0, opacity: 0, scale: 0.9 },
          { y: c.dy, rotation: c.rot, opacity: 1, scale: 1, duration: 0.55, ease: IN }, c.t);
        tl.fromTo(c.id, { borderColor: 'rgba(240,238,230,0.12)' }, { borderColor: 'rgba(217,119,87,1)', duration: 0.3, ease: 'none' }, c.t + 0.1);

        tl.to(spark1, { x: c.sx, y: 150 + c.dy, rotation: 20 * (i + 1), duration: 0.45, ease: MOVE }, i === 0 ? c.t : c.t - 0.05);

      // the spark runs round the loop, reaching "Tốt hơn" on its cue
