  <div id="root" data-composition-id="19-thanh-trang-thai" data-width="1920" data-height="1080" data-duration="8.643">

      <!-- Scene 1: chat window + camera -->

        <div id="f19-world">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var D = 8.143;

      // camera: world scale about origin 0 0; a stage point P lands at C (880, 410) via x = C - S·P
      var PX = 640, PY = 745;
      function camX(S) { return 880 - S * PX; }
      function camY(S) { return 410 - S * PY; }

      // initial states (never tl.set at 0)
      gsap.set("#f19-world", { scale: 1, x: 0, y: 0 });
      gsap.set("#f19-cfill", { scaleX: 0 });

      // ---------- Scene 1 (0–3.94): chat establishes, zoom to the bar, model lights ----------
      tl.fromTo("#f19-win", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#f19-user", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);
      tl.fromTo("#f19-reply .f19-who", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 0.65);
      tl.fromTo("#f19-reply .f19-line", { scaleX: 0 }, { scaleX: 1, duration: 0.35, stagger: 0.12, ease: "power3.out" }, 0.75);

      // "thanh trạng thái" @1.40 — bar outlines, camera zooms onto it
      tl.fromTo("#f19-bar-hl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.4);
      tl.to("#f19-world", { scale: 2, x: camX(2), y: camY(2), duration: 0.95, ease: "power2.inOut" }, 1.4);

      // "mô hình" @2.605 — the model segment lights first
      tl.fromTo("#f19-model-hl", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.6);
      tl.set("#f19-model-txt", { color: "#FFD23F" }, 2.6);
      tl.set("#f19-seg-model .f19-sdot", { backgroundColor: "#FFD23F" }, 2.6);

      // ---------- Scene 2 (3.94–8.14): bar becomes the readout strip ----------
      // zoom-through: the chat world pushes past and dims to a background (~35%)
      tl.to("#f19-world", { scale: 2.6, x: camX(2.6), y: camY(2.6), opacity: 0.35, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, 3.87);
      tl.fromTo("#f19-s2", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.97);

      // "token" @4.573 — counter ticks up, cell goes gold
      var tok = { v: 0 };
      var tokEl = document.getElementById("f19-tok");
      tl.set("#f19-tok", { color: "#FFD23F" }, 4.57);
      tl.fromTo("#f19-hl-tok", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.57);
      tl.fromTo(tok, { v: 0 }, {
        v: 25600, duration: 0.75, ease: "power2.out",
        onUpdate: function () { tokEl.textContent = Math.round(tok.v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
      }, 4.57);
      tl.to("#f19-trail-path", { strokeDashoffset: 840, duration: 0.5, ease: "none" }, 4.57);

      // "mức đầy của ngữ cảnh" @5.376 — context bar fills to 40%
      var pct = { v: 0 };
      var pctEl = document.getElementById("f19-pct");
      tl.set("#f19-tok", { color: "#F4F1E8" }, 5.37);
      tl.to("#f19-hl-tok", { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.37);
      tl.fromTo("#f19-hl-ctx", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.37);
      tl.set("#f19-cpct", { color: "#FFD23F" }, 5.37);
      tl.to("#f19-cfill", { scaleX: 0.4, duration: 0.9, ease: "power2.out" }, 5.37);
      tl.fromTo(pct, { v: 0 }, {
        v: 40, duration: 0.9, ease: "power2.out",
        onUpdate: function () { pctEl.textContent = Math.round(pct.v); }
      }, 5.37);
      tl.to("#f19-trail-path", { strokeDashoffset: 380, duration: 0.6, ease: "none" }, 5.37);

      // "chi phí" @6.72 — cost counts up
      var cost = { v: 0 };
      var costEl = document.getElementById("f19-cost");
      tl.set("#f19-cpct", { color: "#F4F1E8" }, 6.72);
      tl.set("#f19-cfill", { backgroundColor: "#3EE6D0" }, 6.72);
      tl.to("#f19-hl-ctx", { opacity: 0, duration: 0.3, ease: "power2.out" }, 6.72);
      tl.fromTo("#f19-hl-cost", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.72);
      tl.set("#f19-cost", { color: "#FFD23F" }, 6.72);
      tl.fromTo(cost, { v: 0 }, {
        v: 4, duration: 0.6, ease: "power2.out",
        onUpdate: function () { costEl.textContent = "$0.0" + Math.round(cost.v); }
      }, 6.72);
      tl.to("#f19-trail-path", { strokeDashoffset: 0, duration: 0.45, ease: "none" }, 6.72);

      // hold: a quiet 1% drift on the strip
      tl.to("#f19-strip", { scale: 1.01, duration: D - 7.4, ease: "power1.inOut" }, 7.4);

      tl.to({}, { duration: D }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["19-thanh-trang-thai"] = tl;
    })();
  </script>
