  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var D = 10.54;
      var CX = 880, CY = 330;       // dot ellipse centre (stage coords)
      var TX = 880, TY = 470;       // chip centre in Scene 2 (collapse target)
      var N = 24;                   // 20 platform dots + 4 small "+" dots

      // build the platform dots deterministically
      var host = document.getElementById("f42-dots");
      var dots = [];
      for (var i = 0; i < N; i++) {
        var a = (-90 + i * (360 / N)) * Math.PI / 180;
        var rx = 600 + (i % 3) * 32, ry = 262 + (i % 2) * 26;
        var x = CX + Math.cos(a) * rx, y = CY + Math.sin(a) * ry;
        var d = document.createElement("div");
        var small = i % 6 === 5;
        d.className = "f42-dot" + (small ? " f42-s" : (i % 4 === 0 ? " f42-c" : ""));
        var r = small ? 9 : 14;
        d.style.left = (x - r).toFixed(1) + "px";
        d.style.top = (y - r).toFixed(1) + "px";
        host.appendChild(d);
        dots.push({ el: d, dx: TX - x, dy: TY - y, order: (i * 7) % N });
      }

      gsap.set("#f42-num", { scale: 0.45 });

      var tl = gsap.timeline({ paused: true });

      // camera: slow push-in across the stat shots, then pull back wider for the flow shot
      tl.fromTo("#f42-cam", { scale: 1 }, { scale: 1.04, duration: 6.76, ease: "none" }, 0);
      tl.to("#f42-cam", { scale: 1, duration: 0.64, ease: "power2.inOut" }, 6.76);

      // Scene 1 — hero number present on "Gateway", counts up on "hơn hai mươi"
      tl.fromTo("#f42-num", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power3.out" }, 0.31);
      tl.fromTo("#f42-num", { textContent: 0 }, { textContent: 20, snap: { textContent: 1 }, duration: 0.6, ease: "power2.out" }, 1.06);
      tl.fromTo("#f42-num", { scale: 0.45 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 1.06);
      tl.fromTo("#f42-plus", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.7);
      tl.fromTo("#f42-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.62);
      tl.fromTo("#f42-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 1.66);

      // platform dots multiply around the number
      dots.forEach(function (o) {
        tl.fromTo(o.el, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.06 + o.order * 0.05);
      });

      // Scene 2 — "Tất cả": dots collapse into one process; number steps aside
      dots.forEach(function (o) {
        tl.to(o.el, { x: o.dx, y: o.dy, scale: 0.3, opacity: 0, duration: 0.6, ease: "power2.in" }, 3.79 + o.order * 0.015);
      });
      tl.to("#f42-glow", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.79);
      tl.to("#f42-numgroup", { x: -550, y: -200, scale: 0.5, duration: 0.7, ease: "power2.inOut" }, 3.79);
      tl.fromTo("#f42-numrow", { color: "#FFD23F", filter: "drop-shadow(0px 0px 18px rgba(255,210,63,0.55))" }, { color: "#F4F1E8", filter: "drop-shadow(0px 0px 0px rgba(255,210,63,0))", duration: 0.5, ease: "power2.inOut", immediateRender: false }, 3.79);

      // chip lands on "một tiến trình"
      tl.fromTo("#f42-chip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4.54);
      tl.fromTo("#f42-tt", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.7);
      tl.fromTo("#f42-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.25, duration: 0.8, ease: "power2.out" }, 4.54);
      // "chạy nền" status on "nền"
      tl.fromTo("#f42-status", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 6.27);
      tl.to("#f42-chip", { borderColor: "rgba(62,230,208,.7)", duration: 0.4, ease: "power2.out" }, 6.27);
      tl.fromTo("#f42-pdot", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "power2.inOut" }, 7.0);
      tl.to("#f42-pdot", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.5);
      tl.to("#f42-pdot", { opacity: 0.25, duration: 0.5, ease: "power2.inOut" }, 8.5);
      tl.to("#f42-pdot", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.0);
      tl.to("#f42-pdot", { opacity: 0.25, duration: 0.5, ease: "power2.inOut" }, 9.8);

      // Scene 3 — the chip slides left and feeds two lanes
      tl.to("#f42-chipbox", { x: -480, duration: 0.54, ease: "power2.inOut" }, 6.76);
      tl.to("#f42-one", { color: "#F4F1E8", duration: 0.4, ease: "power2.inOut" }, 6.76);
      tl.fromTo(".f42-ghost", { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 7.2);

      // lane 1 — "nhận tin nhắn"
      tl.fromTo("#f42-t1", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "none" }, 7.3);
      tl.fromTo("#f42-lane1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 7.75);
      tl.fromTo("#f42-p1", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 8.1);
      tl.fromTo("#f42-p1", { strokeDashoffset: 0 }, { strokeDashoffset: -150, duration: D - 8.1, ease: "none" }, 8.1);

      // lane 2 — "việc theo lịch" on "chạy các việc"
      tl.fromTo("#f42-t2", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.46, ease: "none" }, 8.4);
      tl.fromTo("#f42-lane2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 8.86);
      tl.fromTo("#f42-l2text", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.2);
      tl.fromTo("#f42-hand", { rotation: 0 }, { rotation: 300, svgOrigin: "34 34", duration: D - 8.86, ease: "none" }, 8.86);
      tl.fromTo("#f42-p2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 9.4);
      tl.fromTo("#f42-p2", { strokeDashoffset: 0 }, { strokeDashoffset: -75, duration: D - 9.4, ease: "none" }, 9.4);

      tl.to({}, { duration: D }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["42-hon-hai-muoi-nen-tang"] = tl;
    })();
  </script>
