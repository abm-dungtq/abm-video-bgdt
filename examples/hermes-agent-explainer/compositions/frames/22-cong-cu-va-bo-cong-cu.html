<template>
  <style>
    @font-face{font-family:"Be Vietnam Pro";font-weight:800;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype");}
    @font-face{font-family:"Be Vietnam Pro";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-Medium.ttf") format("truetype");}
    @font-face{font-family:"Be Vietnam Pro";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype");}
    @font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype");}
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #f4f1e8;
      font-family: "Be Vietnam Pro", sans-serif;
      --canvas: #0b1026; --surface: #141b3a; --ink: #f4f1e8; --gold: #ffd23f;
      --cyan: #3ee6d0; --warn: #ff6b6b; --muted: #8e93b5;
    }
    /* full-bleed ground on its own clip (never on #root); H = 230 + 12 × chapter */
    #f22-ground {
      position: absolute;
      inset: 0;
      background: var(--canvas);
    }
    /* hue shift +12°: ch2's glow (H 254) hands over to ch3 (H 266) */
    #f22-ground .f22-glow {
      position: absolute;
      inset: 0;
    }
    #f22-glow-prev {
      background: radial-gradient(ellipse at 70% 30%, hsla(254, 70%, 45%, 0.28), transparent 60%);
    }
    #f22-glow-ch {
      background: radial-gradient(ellipse at 70% 30%, hsla(266, 70%, 45%, 0.28), transparent 60%);
    }
    /* the stage: safe area x 80–1840, y 60–880 */
    #f22-stage {
      position: absolute;
      left: 80px;
      top: 60px;
      width: 1760px;
      height: 820px;
    }
    /* frame-specific styles below — prefix every id/class with f22- */
    #f22-cam {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    /* numeral group: 360×560 box, 1:1 with the SVG viewBox */
    #f22-numeral {
      position: absolute;
      left: 250px;
      top: 130px;
      width: 360px;
      height: 560px;
      transform-origin: 180px 280px;
    }
    #f22-bloom {
      position: absolute;
      left: -180px;
      top: -70px;
      width: 720px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 210, 63, 0.22), rgba(255, 210, 63, 0.06) 55%, transparent 100%);
    }
    #f22-ring-spin {
      position: absolute;
      left: -150px;
      top: -50px;
      width: 660px;
      height: 660px;
    }
    #f22-ring {
      position: absolute;
      left: 0;
      top: 0;
      width: 660px;
      height: 660px;
      overflow: visible;
    }
    #f22-glyph {
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;
      height: 560px;
      overflow: visible;
    }
    #f22-trace {
      filter: drop-shadow(0 0 12px rgba(255, 210, 63, 0.55));
    }
    /* title block beside the numeral */
    #f22-title-group {
      position: absolute;
      left: 720px;
      top: 250px;
    }
    #f22-kicker {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }
    .f22-diamond {
      display: block;
      width: 12px;
      height: 12px;
      background: var(--gold);
      transform: rotate(45deg);
    }
    .f22-line-mask {
      overflow: hidden;
      padding: 8px 8px 12px 0;
    }
    #f22-mask-1 { margin-top: 14px; }
    .f22-line {
      font-size: 96px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: var(--ink);
    }
    .f22-gold { color: var(--gold); }
    .f22-word { display: inline-block; }
    #f22-hair-wrap {
      position: relative;
      margin-top: 10px;
      height: 3px;
      width: 100%;
    }
    #f22-hairline {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: var(--gold);
      transform-origin: 0 50%;
      filter: drop-shadow(0 0 10px rgba(255, 210, 63, 0.55));
    }
    #f22-hair-mover { position: absolute; left: 0; top: 0; width: 100%; height: 3px; }
    #f22-hair-head {
      position: absolute;
      top: -6px;
      left: 0;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px 4px rgba(255, 210, 63, 0.6);
    }
  </style>

  <div id="root" data-composition-id="22-cong-cu-va-bo-cong-cu" data-width="1920" data-height="1080" data-duration="4.254">
    <div id="f22-ground" class="clip" data-start="0" data-duration="4.254" data-track-index="0">
      <div id="f22-glow-prev" class="f22-glow"></div>
      <div id="f22-glow-ch" class="f22-glow"></div>
    </div>
    <div id="f22-stage" class="clip" data-start="0" data-duration="4.254" data-track-index="1">
      <div id="f22-cam">
        <div id="f22-numeral">
          <div id="f22-bloom"></div>
          <div id="f22-ring-spin">
          <svg id="f22-ring" viewBox="0 0 660 660" width="660" height="660">
            <circle cx="330" cy="330" r="318" fill="none" stroke="rgba(244,241,232,0.10)" stroke-width="2" stroke-dasharray="2 12"></circle>
            <circle cx="330" cy="330" r="270" fill="none" stroke="rgba(142,147,181,0.10)" stroke-width="1.5"></circle>
          </svg>
          </div>
          <svg id="f22-glyph" viewBox="0 0 360 560" width="360" height="560">
            <defs>
              <linearGradient id="f22-fillgrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD23F" stop-opacity="0.30"></stop>
                <stop offset="1" stop-color="#FFD23F" stop-opacity="0.05"></stop>
              </linearGradient>
            </defs>
            <path id="f22-fill" fill="url(#f22-fillgrad)" stroke="none"></path>
            <path id="f22-trace" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>
            <g id="f22-spark">
              <circle cx="0" cy="0" r="16" fill="rgba(255,210,63,0.22)"></circle>
              <path d="M -3 -3 C -10 -16, -22 -17, -30 -10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>
              <path d="M -3 3 C -10 16, -22 17, -30 10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>
              <circle cx="0" cy="0" r="7" fill="#FFD23F"></circle>
            </g>
          </svg>
        </div>

        <div id="f22-title-group">
          <div id="f22-kicker"><span class="f22-diamond"></span><span>Chương 3</span></div>
          <div id="f22-mask-1" class="f22-line-mask">
            <div id="f22-line-1" class="f22-line"><span id="f22-w1" class="f22-word f22-gold">Công</span> <span id="f22-w2" class="f22-word f22-gold">cụ</span> <span id="f22-w3" class="f22-word">và</span></div>
          </div>
          <div id="f22-mask-2" class="f22-line-mask">
            <div id="f22-line-2" class="f22-line">bộ công cụ</div>
          </div>
          <div id="f22-hair-wrap">
            <div id="f22-hairline"></div>
            <div id="f22-hair-mover"><div id="f22-hair-head"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.754;

      // numeral "3" outline (viewBox units = px): two stacked bowls meeting on the right, open on the left
      var AX = 175, AY = 175, RAO = 135, RAI = 70;   // upper bowl
      var BX = 175, BY = 395, RBO = 150, RBI = 85;   // lower bowl
      var PTS = [];
      var a, s;
      function arc(cx, cy, r, a0, a1, n) {
        for (var q = 0; q <= n; q++) {
          var ang = (a0 + ((a1 - a0) * q) / n) * Math.PI / 180;
          PTS.push([cx + r * Math.cos(ang), cy + r * Math.sin(ang)]);
        }
      }
      // upper outer: from the top-left terminal, clockwise over the top down to the right notch
      arc(AX, AY, RAO, 200, 408, 22);
      // lower outer: from the notch, clockwise round the right and bottom to the bottom-left terminal
      arc(BX, BY, RBO, -53, 160, 24);
      // lower inner: back counter-clockwise up to the waist
      arc(BX, BY, RBI, 160, -90, 22);
      // waist bar tip on the left
      PTS.push([115, 310], [115, 245]);
      // upper inner: counter-clockwise back to the top-left terminal
      arc(AX, AY, RAI, 90, -160, 20);
      // close the terminal
      PTS.push([PTS[0][0], PTS[0][1]]);

      var cum = [0];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      var LEN = cum[cum.length - 1];
      var d = "M " + PTS[0][0].toFixed(2) + " " + PTS[0][1].toFixed(2);
      for (var j = 1; j < PTS.length; j++) d += " L " + PTS[j][0].toFixed(2) + " " + PTS[j][1].toFixed(2);
      d += " Z";

      var trace = document.getElementById("f22-trace");
      var fill = document.getElementById("f22-fill");
      var spark = document.getElementById("f22-spark");
      trace.setAttribute("d", d);
      fill.setAttribute("d", d);
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);

      // courier spark rides the head of the trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var p0 = PTS[k - 1], p1 = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = p0[0] + (p1[0] - p0[0]) * t;
        var y = p0[1] + (p1[1] - p0[1]) * t;
        var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.39 s) — "Chương ba": hue shifts +12°, the trail writes a large "3"
      tl.fromTo("#f22-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f22-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f22-ring", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f22-ring-spin", { rotation: 0 }, { rotation: -28, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 1.1, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      // "Chương" @ 0.86 — kicker names the chapter
      tl.fromTo("#f22-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.86);
      // "ba" @ 1.02 — the written 3 fills and blooms as the trail closes
      tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.02);
      tl.fromTo("#f22-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 1.0);
      tl.to(spark, { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 1.25);

      // Scene 2 (1.39–3.75 s) — numeral settles left, the title slides up word by word, hairline draws
      tl.fromTo("#f22-numeral", { x: 260, scale: 1.1 }, { x: 0, scale: 0.92, duration: 0.6, ease: "power2.inOut" }, 1.39);
      // "công" @ 1.505 · "cụ" @ 1.706 · "và" @ 2.169 — gold keyword words slide up out of the mask
      tl.fromTo("#f22-w1", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.5);
      tl.fromTo("#f22-w2", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.7);
      tl.fromTo("#f22-w3", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.16);
      // "bộ" @ 2.43 — second line
      tl.fromTo("#f22-line-2", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.43);
      // "công cụ" @ 2.65 — courier hairline draws under the title
      tl.fromTo("#f22-hairline", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "none" }, 2.65);
      tl.fromTo("#f22-hair-mover", { xPercent: 0 }, { xPercent: 100, duration: 0.6, ease: "none" }, 2.65);
      tl.fromTo("#f22-hair-head", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.65);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f22-cam", { scale: 1 }, { scale: 1.012, duration: DUR - 2.2, ease: "none" }, 2.2);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["22-cong-cu-va-bo-cong-cu"] = tl;
    })();
  </script>
</template>
