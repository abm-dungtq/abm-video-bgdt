  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.361;

      // numeral "7" written as one stroke (viewBox units = px): top bar, then the long diagonal down.
      var PTS = [
        [40, 72], [120, 70], [200, 69], [322, 72], [300, 128], [272, 196],
        [244, 268], [218, 342], [196, 414], [178, 474], [166, 528]
      ];

      var cum = [0];
      var d = "M " + PTS[0][0] + " " + PTS[0][1];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
        d += " L " + PTS[i][0] + " " + PTS[i][1];
      }
      var LEN = cum[cum.length - 1];

      var trace = document.getElementById("f58-trace");
      var ghost = document.getElementById("f58-ghost");
      var spark = document.getElementById("f58-spark");
      trace.setAttribute("d", d);
      ghost.setAttribute("d", d);
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);
      trace.setAttribute("stroke-dashoffset", LEN);

      // courier spark rides the head of the numeral trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var p0 = PTS[k - 1], p1 = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = p0[0] + (p1[0] - p0[0]) * t;
        var y = p0[1] + (p1[1] - p0[1]) * t;
        var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      // coral arc on the inner ring: warn enters the palette for chapter 7 only
      var ALEN = 1647; // ≥ 2π·262
      var arc = document.getElementById("f58-warn-arc");
      arc.setAttribute("stroke-dasharray", ALEN + " " + ALEN);
      arc.setAttribute("stroke-dashoffset", ALEN);

      // underline trail: fixed length bound (≥ true curve length) keeps it deterministic
      var ULEN = 560;
      var under = document.getElementById("f58-under-path");
      under.setAttribute("stroke-dasharray", ULEN + " " + ULEN);
      under.setAttribute("stroke-dashoffset", ULEN);

      gsap.set([spark, ghost, "#f58-kicker", "#f58-bloom", "#f58-warn-dot"], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.32 s) — "Chương bảy": hue shifts +12°, coral enters, the trail writes a large "7"
      tl.fromTo("#f58-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f58-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f58-decor", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f58-ring-spin", { rotation: 0 }, { rotation: -24, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(arc, { attr: { "stroke-dashoffset": ALEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.15, ease: "power2.inOut" }, 0.15);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.95, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 0.95, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      // "Chương" @ 0.861 — the chapter kicker, its coral dot marking the new colour
      tl.fromTo("#f58-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.86);
      tl.fromTo("#f58-warn-dot", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.95);
      // "bảy" @ 1.002 — the written 7 gains body and blooms as the trail lands
      tl.fromTo(ghost, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.0);
      tl.fromTo("#f58-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.0);
      tl.to(spark, { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 1.1);

      // Scene 2 (1.32–3.36 s) — numeral settles left, "Dùng Hermes" then "an toàn" slide up on cue
      tl.fromTo("#f58-numeral", { x: 260, scale: 1.1 }, { x: 0, scale: 0.92, duration: 0.55, ease: "power2.inOut" }, 1.32);
      // audio_meta: "dùng" 1.609, "Hermes" 1.811
      tl.fromTo("#f58-w1", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.6);
      tl.fromTo("#f58-w2", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.8);
      // cues: "an" @ 2.2, "toàn" @ 2.34
      tl.fromTo("#f58-w3", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.2);
      tl.fromTo("#f58-w4", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.34);
      // the courier trail underlines "an toàn"
      tl.fromTo(under, { attr: { "stroke-dashoffset": ULEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "none" }, 2.5);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f58-cam", { scale: 1 }, { scale: 1.01, duration: DUR - 2.95, ease: "none" }, 2.95);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["58-dung-an-toan-va-tong-ket"] = tl;
    })();
  </script>
