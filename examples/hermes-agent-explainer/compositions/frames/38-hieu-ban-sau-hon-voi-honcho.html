  <script>
    (function () {
      var IN = "power3.out", MOVE = "power2.inOut";
      var R = 340;
      // final orbit angles (deg) after a 40° drift; chosen to keep clear of the plug and the header
      var FIN = [45, 100, 150, 200, 225, 320];
      var DRIFT = 40;

      /* ---- initial hidden states (inner nodes only, never clips) ---- */
      gsap.set(["#f38-core", "#f38-corelbl", "#f38-socket", "#f38-pulse", "#f38-plug", "#f38-kick",
                "#f38-label span", "#f38-tkick", "#f38-term", "#f38-l2", "#f38-l3", "#f38-l4"], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0–3.75): Hermes core, orbiting chat fragments, Honcho plug docks ---- */
      tl.fromTo("#f38-core", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 0.31);
      tl.fromTo("#f38-corelbl", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.49);   // Hermes
      tl.fromTo("#f38-orbit", { opacity: 0 }, { opacity: 0.35, duration: 0.6, ease: IN }, 0.97);               // hiểu
      for (var i = 0; i < 6; i++) {
        var base = FIN[i] - DRIFT, t0 = 0.97 + i * 0.13;                                                      // hiểu bạn sâu hơn nữa
        tl.fromTo("#f38-a" + i, { rotation: base }, { rotation: FIN[i], duration: 4.6 - 0.97, ease: "none" }, 0.97);
        tl.fromTo("#f38-w" + i, { rotation: -base }, { rotation: -FIN[i], duration: 4.6 - 0.97, ease: "none" }, 0.97);
        tl.fromTo("#f38-b" + i, { opacity: 0, scale: 0.4 }, { opacity: 0.6, scale: 1, duration: 0.45, ease: IN }, t0);
      }
      // gắn @2.81 — a socket lights on the core
      tl.fromTo("#f38-socket", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 2.81);
      // Honcho @3.21 — the plug slides in and docks
      tl.fromTo("#f38-plug", { opacity: 0, x: 380 }, { opacity: 1, x: 0, duration: 0.45, ease: IN }, 3.21);
      tl.fromTo("#f38-cring", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 3.56);
      tl.fromTo("#f38-pulse", { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out" }, 3.56);

      /* ---- Scene 2 (3.75–7.99): plug lifts to a header; fragments flow in and build the portrait ---- */
      tl.to("#f38-pluggold", { opacity: 0, duration: 0.3, ease: MOVE }, 3.8);
      tl.to("#f38-plug", { x: -270, y: -335, scale: 0.85, duration: 0.55, ease: MOVE }, 3.8);
      tl.to("#f38-socket", { opacity: 0, duration: 0.3, ease: MOVE }, 3.8);
      tl.to("#f38-corelbl", { opacity: 0, duration: 0.3, ease: MOVE }, 3.9);
      // suy @4.53 / ngẫm @4.65 — reflection kicker; the core ring settles into the portrait's head
      tl.fromTo("#f38-kick", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IN }, 4.53);
      tl.fromTo("#f38-kd", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 4.53);
      tl.fromTo("#f38-k1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 4.53);
      tl.fromTo("#f38-k2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 4.65);
      tl.to("#f38-core", { y: -70, scale: 80 / 105, duration: 0.6, ease: MOVE }, 4.53);
      tl.to("#f38-cring", { opacity: 0, duration: 0.5, ease: MOVE }, 4.53);
      // fragments stream inward one by one (sau mỗi cuộc trò chuyện); each arrival draws a stroke
      var segs = ["#f38-s0", "#f38-s1", "#f38-s2", "#f38-s3", "#f38-s4"];
      var order = [4, 5, 0, 3, 1, 2]; // nearest-to-farthest feel, alternating sides
      for (var k = 0; k < 6; k++) {
        var w = "#f38-w" + order[k], b = "#f38-b" + order[k], ts = 4.65 + k * 0.26, arrive = ts + 0.6;
        tl.to(w, { x: -R, scale: 0.3, duration: 0.6, ease: "power2.in" }, ts);
        tl.to(b, { opacity: 0, duration: 0.2, ease: MOVE }, arrive - 0.2);
        if (k < 5) {
          tl.fromTo(segs[k], { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "none" }, arrive - 0.05);
        }
      }
      tl.to("#f38-orbit", { opacity: 0, duration: 0.4, ease: MOVE }, 6.2);
      // xây dựng @6.50 — memory nodes light up across the portrait
      for (var n = 0; n < 6; n++) {
        tl.fromTo("#f38-n" + n, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" },
                  { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 6.5 + n * 0.06);
      }
      // chân @6.91 · dung @7.11 · về @7.29 · bạn @7.41
      tl.fromTo("#f38-lb1", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 6.91);
      tl.fromTo("#f38-lb2", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 7.11);
      tl.fromTo("#f38-lb3", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 7.29);
      tl.fromTo("#f38-lb4", { opacity: 0, y: 36, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: IN }, 7.41);
      tl.fromTo("#f38-ul", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 7.41);
