        var t = 2.75 + k * 0.07;

      });

      tl.fromTo("#f49-k-song", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.05);

      var workStart = 5.85;
      var laneEnd = [7.30, 7.47, 7.64];
      var cardT = [7.42, 7.60, 7.78];
      var fillEase = ["power1.inOut", "power2.inOut", "sine.inOut"];
      [1, 2, 3].forEach(function (i, k) {
        var dur = laneEnd[k] - workStart;
        tl.fromTo("#f49-fill" + i, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: fillEase[k] }, workStart);
        // working spinner around the child (finite, timeline-driven, dies when the lane resolves)
        tl.fromTo("#f49-spin" + i, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, workStart);
        tl.fromTo("#f49-spin" + i, { rotation: 0 }, { rotation: 360 * dur * 0.9, duration: dur, ease: "none" }, workStart);
        tl.set("#f49-spin" + i, { opacity: 0 }, laneEnd[k]);

        tl.fromTo("#f49-dots" + i, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, workStart);
        var dots = document.querySelectorAll("#f49-dots" + i + " .f49-dot");
        for (var d = 0; d < 3; d++) {
          for (var t = workStart + 0.1 + d * 0.12; t + 0.36 <= laneEnd[k]; t += 0.42) {
            tl.to(dots[d], { opacity: 1, duration: 0.18, ease: "sine.inOut" }, t);
            tl.to(dots[d], { opacity: 0.3, duration: 0.18, ease: "sine.inOut" }, t + 0.18);
