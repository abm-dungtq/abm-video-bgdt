      <div id="f12-cam">
        <div id="f12-numeral">
          <div id="f12-bloom"></div>
          <div id="f12-ring-spin">
          <svg id="f12-ring" viewBox="0 0 660 660" width="660" height="660">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.942;

      // numeral "2" outline (viewBox units = px), built from sampled arcs + straight edges
      var CX = 180, CY = 185, RO = 150, RI = 80;
      var PTS = [];
      var a, s;
      // outer bowl: from the left terminal, clockwise over the top to the shoulder
      for (s = 0; s <= 24; s++) {
        a = (180 + (210 * s) / 24) * Math.PI / 180;
        PTS.push([CX + RO * Math.cos(a), CY + RO * Math.sin(a)]);
      }
      // outer diagonal down to the base, then the base bar
      PTS.push([135, 450], [330, 450], [330, 540], [30, 540], [30, 470]);
      // inner diagonal back up to the inner bowl
      PTS.push([CX + RI * Math.cos(50 * Math.PI / 180), CY + RI * Math.sin(50 * Math.PI / 180)]);
      // inner bowl: counter-clockwise over the top back to the left
      for (s = 1; s <= 20; s++) {
        a = (50 - (230 * s) / 20) * Math.PI / 180;
        PTS.push([CX + RI * Math.cos(a), CY + RI * Math.sin(a)]);
      }
      // close the terminal
      PTS.push([PTS[0][0], PTS[0][1]]);

      var cum = [0];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      var LEN = cum[cum.length - 1];
      var d = "M " + PTS[0][0].toFixed(2) + " " + PTS[0][1].toFixed(2);
      for (var j = 1; j < PTS.length; j++) d += " L " + PTS[j][0].toFixed(2) + " " + PTS[j][1].toFixed(2);
      d += " Z";

      var trace = document.getElementById("f12-trace");
      var fill = document.getElementById("f12-fill");
      var spark = document.getElementById("f12-spark");
      trace.setAttribute("d", d);
      fill.setAttribute("d", d);
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);

      // courier spark rides the head of the trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var p0 = PTS[k - 1], p1 = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = p0[0] + (p1[0] - p0[0]) * t;
        var y = p0[1] + (p1[1] - p0[1]) * t;
        var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.48 s) — "Chương hai": hue shifts +12°, the trail writes a large "2"
      tl.fromTo("#f12-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.3, ease: "power2.inOut" }, 0);
      tl.fromTo("#f12-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.3, ease: "power2.inOut" }, 0);
      tl.fromTo("#f12-ring", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f12-ring-spin", { rotation: 0 }, { rotation: -28, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 1.2, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      // "Chương" @ 0.86 — kicker names the chapter
      tl.fromTo("#f12-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.86);
      // "hai" @ 1.06 — the written 2 fills and blooms as the trail closes
      tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.1);
      tl.fromTo("#f12-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 1.05);

      // Scene 2 (1.48–3.94 s) — numeral settles left, the title slides up on cue, hairline draws
      tl.fromTo("#f12-numeral", { x: 260, scale: 1.1 }, { x: 0, scale: 0.92, duration: 0.6, ease: "power2.inOut" }, 1.48);
      tl.to(spark, { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 1.4);
      // "cài" @ 1.71
      tl.fromTo("#f12-line-1", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.7);
      // "trò" @ 2.33 — gold keyword line
      tl.fromTo("#f12-line-2", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.33);
      // "chuyện" @ 2.5 — courier hairline draws under the title
      tl.fromTo("#f12-hairline", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "none" }, 2.5);
      tl.fromTo("#f12-hair-mover", { xPercent: 0 }, { xPercent: 100, duration: 0.6, ease: "none" }, 2.5);
      tl.fromTo("#f12-hair-head", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.5);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f12-cam", { scale: 1 }, { scale: 1.012, duration: DUR - 2.2, ease: "none" }, 2.2);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["12-cai-dat-va-tro-chuyen-dau-tien"] = tl;
    })();
  </script>
