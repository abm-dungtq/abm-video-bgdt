      tl.set("#f14-caret", { opacity: 0 }, 1.35);

      var hermesT = [1.94, 2.0, 2.06, 2.12, 2.18, 2.24];

        tl.fromTo(d + " .f14-num", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, doorT[k]);
      });

      // "cài nhanh" @5.16

      // "Nous" @5.80 — the portal tag and gold light
      tl.fromTo("#f14-tag1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 5.8);
      tl.fromTo("#f14-glow1", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 5.8);
      // pan to door 2 — "cài đầy đủ" @6.79
      tl.to("#f14-world", { x: -620, duration: 0.5, ease: "power2.inOut" }, 6.3);
