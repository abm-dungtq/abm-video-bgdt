  <script>
    (function () {
      var GOLD = "#ffd23f", INK = "#f4f1e8";
      var GLOW = "drop-shadow(0 0 16px rgba(255,210,63,.6))";
      var NOGLOW = "drop-shadow(0 0 0px rgba(255,210,63,0))";
      function q(id) { return document.getElementById(id); }
      function P(cx, cy) { return { x: cx - 44, y: cy - 44 }; } // chip centre -> top-left

      // chip paths (centres, stage coords)
      var chips = [
        // id, scatter, cluster, edge (after slam), hover/wait
        { id: "f24-cA1", s: P(520, 300),  c: P(380, 380),  e: P(560, 150),  w: P(770, 210) },
        { id: "f24-cA2", s: P(1180, 600), c: P(500, 380),  e: P(880, 130),  w: P(880, 190) },
        { id: "f24-cA3", s: P(760, 640),  c: P(440, 490),  e: P(1200, 150), w: P(990, 210) },
        { id: "f24-cB1", s: P(300, 520),  c: P(820, 380),  e: P(70, 300),   w: P(160, 130) },
        { id: "f24-cB2", s: P(980, 230),  c: P(940, 380),  e: P(90, 480),   w: P(280, 110) },
        { id: "f24-cB3", s: P(1440, 420), c: P(880, 490),  e: P(70, 660),   w: P(400, 130) },
        { id: "f24-cC1", s: P(640, 470),  c: P(1260, 380), e: P(1690, 300), w: P(1360, 130) },
        { id: "f24-cC2", s: P(1320, 250), c: P(1380, 380), e: P(1670, 480), w: P(1480, 110) },
        { id: "f24-cC3", s: P(1060, 420), c: P(1320, 490), e: P(1690, 660), w: P(1600, 130) }
      ];
      // initial state (before the timeline is built)
      chips.forEach(function (c) { gsap.set(q(c.id), { x: c.s.x, y: c.s.y }); });
      gsap.set(q("f24-boxA"), { x: 580, scale: 1.2, transformOrigin: "50% 50%" });

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0–2.98): kinetic ----------
      chips.forEach(function (c, i) {
        tl.fromTo(q(c.id), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0.31 + i * 0.05);
        tl.to(q(c.id), { x: c.c.x, y: c.c.y, duration: 0.6, ease: "power2.inOut" }, 0.99 + (i % 3) * 0.04); // gom
      });
      tl.fromTo(q("f24-k1"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.99);
      ["f24-ringA", "f24-ringB", "f24-ringC"].forEach(function (r, i) {
        tl.fromTo(q(r), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 1.55 + i * 0.06); // nhóm
        tl.to(q(r), { opacity: 0, scale: 1.4, duration: 0.4, ease: "power2.out" }, 2.98);
      });
      // "toolset" slams on its cue; the groups blast to the edges
      tl.fromTo(q("f24-word"), { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 2.98);
      tl.fromTo(q("f24-shock"), { opacity: 0.85, scale: 0.4 }, { opacity: 0, scale: 2.5, duration: 0.7, ease: "power2.out" }, 2.98);
      chips.forEach(function (c) {
        tl.to(q(c.id), { x: c.e.x, y: c.e.y, scale: 0.8, duration: 0.55, ease: "power3.out" }, 2.98);
      });

      // ---------- Scene 2 (2.98–6.56): toolset -> toolbox ----------
      // tools drift in from the edges
      chips.forEach(function (c, i) {
        tl.to(q(c.id), { x: c.w.x, y: c.w.y, scale: 1, duration: 1.4, ease: "power2.inOut" }, 4.06 + i * 0.08);
      });
      // word morphs into the box outline on "hộp"
      tl.to(q("f24-word"), { opacity: 0, scale: 0.3, y: 70, duration: 0.45, ease: "power2.in" }, 5.76);
      tl.fromTo(q("f24-fillA"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.9);
      tl.fromTo(q("f24-bodyA"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "none" }, 5.76);
      tl.fromTo(q("f24-rimA"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "none" }, 5.94);
      tl.to(q("f24-k1"), { opacity: 0, duration: 0.25, ease: "power2.out" }, 5.8);
      tl.fromTo(q("f24-k2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.08); // nghề
      // group A drops in, lid snaps shut
      [0, 1, 2].forEach(function (i) {
        var c = chips[i];
        tl.to(q(c.id), { y: c.w.y + 230, scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, 6.08 + i * 0.05);
      });
      tl.fromTo(q("f24-lidA"), { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.in" }, 6.38);
      tl.fromTo(q("f24-boxA-in"), { y: 8 }, { y: 0, duration: 0.3, ease: "power3.out" }, 6.54);

      // ---------- Scene 3 (6.56–8.57): two more boxes fill and shut ----------
      tl.to(q("f24-boxA"), { x: 0, scale: 1, duration: 0.6, ease: "power2.inOut" }, 6.92); // Mỗi
      tl.fromTo(q("f24-bodyB"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 7.08);
      tl.fromTo(q("f24-rimB"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "none" }, 7.25);
      tl.fromTo(q("f24-fillB"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.2);
      tl.fromTo(q("f24-bodyC"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 7.25);
      tl.fromTo(q("f24-rimC"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "none" }, 7.41);
      tl.fromTo(q("f24-fillC"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.37);
      // group B -> box B (centre 880)
      [3, 4, 5].forEach(function (i, k) {
        var c = chips[i];
        var hx = 880 + (k - 1) * 110 - 44, hy = 230 - 44;
        tl.to(q(c.id), { x: hx, y: hy, duration: 0.42, ease: "power2.inOut" }, 7.25 + k * 0.05);
        tl.to(q(c.id), { y: hy + 240, scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" }, 7.72 + k * 0.04);
      });
      tl.fromTo(q("f24-lidB"), { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.in" }, 7.85);
      tl.fromTo(q("f24-boxB-in"), { y: 8 }, { y: 0, duration: 0.3, ease: "power3.out" }, 8.01); // một
      // group C -> box C (centre 1460)
      [6, 7, 8].forEach(function (i, k) {
        var c = chips[i];
        var hx = 1460 + (k - 1) * 110 - 44, hy = 230 - 44;
        tl.to(q(c.id), { x: hx, y: hy, duration: 0.42, ease: "power2.inOut" }, 7.6 + k * 0.05);
        tl.to(q(c.id), { y: hy + 240, scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" }, 8.08 + k * 0.04);
      });
      tl.fromTo(q("f24-lidC"), { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.in" }, 8.27);
      tl.fromTo(q("f24-boxC-in"), { y: 8 }, { y: 0, duration: 0.3, ease: "power3.out" }, 8.43); // công
      tl.to(q("f24-k2"), { opacity: 0, duration: 0.25, ease: "power2.out" }, 8.3);

      // ---------- Scene 4 (8.57–13.42): labels land on cue ----------
      tl.fromTo(q("f24-k3"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.57); // việc
      tl.fromTo(q("f24-row"), { scale: 1 }, { scale: 1.015, duration: 4.85, ease: "none", transformOrigin: "50% 50%" }, 8.57);

      function wordIn(id, t) {
        tl.fromTo(q(id), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      }
      function glyphOn(g, t) {
        tl.fromTo(q(g), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, t);
        tl.set(q(g), { color: GOLD, filter: GLOW }, t);
      }
      function glyphOff(g, t) { tl.set(q(g), { color: INK, filter: NOGLOW }, t); }
      function seg(id, t, d) { tl.fromTo(q(id), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "none" }, t); }
