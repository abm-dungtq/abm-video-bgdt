  <script>
    (function () {
      /* ---- deterministic rising-spiral geometry (pseudo-3D helix, 2.5 turns) ---- */
      var N = 400, th0 = Math.PI / 2, span = 5 * Math.PI;
      var px = [], py = [], cum = [0], d = "";
      for (var i = 0; i <= N; i++) {
        var u = i / N, th = th0 + span * u;
        var rx = 260 + 80 * u, ry = 78 + 22 * u, yb = 720 - 340 * u;
        px.push(880 + rx * Math.cos(th));
        py.push(yb + ry * Math.sin(th));
        d += (i === 0 ? "M" : " L") + px[i].toFixed(1) + " " + py[i].toFixed(1);
        if (i > 0) cum.push(cum[i - 1] + Math.hypot(px[i] - px[i - 1], py[i] - py[i - 1]));
      }
      var L = cum[N];
      var spiral = document.getElementById("f30-spiral");
      spiral.setAttribute("d", d);
      var marks = [["f30-m1", N * 0.4], ["f30-m2", N * 0.8], ["f30-m3", N]];
      marks.forEach(function (m) {
        var el = document.getElementById(m[0]);
        el.setAttribute("cx", px[m[1]].toFixed(1));
        el.setAttribute("cy", py[m[1]].toFixed(1));
      });
      var S0 = 8.43, SD = 1.32; // spiral draws from "dùng" to just before "làm"
      function markTime(idx) { return S0 + SD * (cum[idx] / L); }

      /* ---- initial hidden inner states (never clips) ---- */
      gsap.set(spiral, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
      gsap.set(["#f30-trail", "#f30-spark", "#f30-ghost", "#f30-status", "#f30-chip",
                "#f30-hl1", "#f30-hl2", "#f30-hl3", "#f30-check", "#f30-kd"], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });
      var IN = "power3.out", MOVE = "power2.inOut";

      /* ---- Scene 1 (0–3.73): kinetic kicker, then the display phrase ---- */
      tl.fromTo("#f30-kd", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, 0.31);
      tl.fromTo("#f30-k1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 0.31);   // Điểm
      tl.fromTo("#f30-k2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 0.472);  // đặc
      tl.fromTo("#f30-k3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 0.592);  // biệt
      tl.fromTo("#f30-k4", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 0.754);  // nhất
      tl.fromTo("#f30-kh", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: IN }, 1.056);  // Hermes
      tl.fromTo("#f30-ghost", { opacity: 0 }, { opacity: 0.3, duration: 0.6, ease: IN }, 1.881);           // là — the loop's footprint
      tl.fromTo("#f30-w1", { opacity: 0, y: 60, scale: 1.18 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: IN }, 2.063); // vòng
      tl.fromTo("#f30-w2", { opacity: 0, y: 60, scale: 1.18 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: IN }, 2.244); // học
      tl.fromTo("#f30-w3", { opacity: 0, y: 60, scale: 1.18 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: IN }, 2.425); // khép
      tl.fromTo("#f30-kin", { opacity: 0, y: 60, scale: 1.18 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: IN }, 2.607); // kín
      tl.fromTo("#f30-ul", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.55, ease: "none" }, 2.607);

      /* ---- Scene 2 (3.73–7.78): phrase lifts to a kicker; stations pop onto the ring ---- */
      tl.to("#f30-kick", { opacity: 0, y: -30, duration: 0.35, ease: MOVE }, 3.3);
      tl.to("#f30-title", { y: -360, scale: 0.42, duration: 0.55, ease: MOVE }, 3.3);
      // ghi @3.73 — station 1 + the machine starts working
      tl.fromTo("#f30-node1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: IN }, 3.731);
      tl.fromTo("#f30-status", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 3.731);
      tl.fromTo("#f30-s1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 3.731);
      tl.fromTo("#f30-spin", { rotation: 0 }, { rotation: 900, duration: 2.713, ease: "none" }, 3.731);
      // nhớ @3.85 — station 1 goes gold, the spark ignites at the top of the ring
      tl.fromTo("#f30-hl1", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 3.851);
      tl.fromTo("#f30-spark", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 3.851);
      tl.fromTo("#f30-trail", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: IN }, 3.95);
      // trail leg 1 → station 2 (arrives on "tạo" @4.70)
      tl.fromTo("#f30-trail", { strokeDashoffset: 100 }, { strokeDashoffset: 66.667, duration: 0.75, ease: "none" }, 3.95);
      tl.fromTo("#f30-orbit", { rotation: 0 }, { rotation: 120, duration: 0.75, ease: "none" }, 3.95);
      tl.set("#f30-s1", { opacity: 0 }, 4.695);
      tl.fromTo("#f30-s2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 4.695);
      tl.fromTo("#f30-node2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: IN }, 4.695);
      // năng @5.04 — gold focus hands over to station 2
      tl.to("#f30-hl1", { opacity: 0, duration: 0.25, ease: MOVE }, 5.037);
      tl.fromTo("#f30-hl2", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 5.037);
      // trail leg 2 → station 3 (arrives on "hiểu" @5.74)
      tl.to("#f30-trail", { strokeDashoffset: 33.333, duration: 0.64, ease: "none" }, 5.1);
      tl.to("#f30-orbit", { rotation: 240, duration: 0.64, ease: "none" }, 5.1);
      tl.set("#f30-s2", { opacity: 0 }, 5.741);
      tl.fromTo("#f30-s3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 5.741);
      tl.fromTo("#f30-node3", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: IN }, 5.741);
      // hơn @6.10 — gold to station 3, growth arrow
      tl.to("#f30-hl2", { opacity: 0, duration: 0.25, ease: MOVE }, 6.103);
      tl.fromTo("#f30-hl3", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 6.103);
      tl.fromTo("#f30-chip", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IN }, 6.103);
      tl.fromTo("#f30-cup", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 6.103);
      tl.fromTo("#f30-cmoi", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 6.283);  // mỗi
      tl.fromTo("#f30-cngay", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 6.444); // ngày
      // trail leg 3 closes the ring on "ngày" @6.44; the working state resolves
      tl.to("#f30-trail", { strokeDashoffset: 0, duration: 0.44, ease: "none" }, 6.0);
      tl.to("#f30-orbit", { rotation: 360, duration: 0.44, ease: "none" }, 6.0);
      tl.set("#f30-s3", { opacity: 0 }, 6.444);
      tl.set("#f30-spin", { opacity: 0 }, 6.444);
      tl.fromTo("#f30-s4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 6.444);
      tl.fromTo("#f30-check", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, 6.444);
      tl.fromTo("#f30-checkp", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.3, ease: "none" }, 6.55);

      /* ---- Scene 3 (7.78–11.16): the ring lifts into a rising spiral ---- */
      tl.to(["#f30-slot1", "#f30-slot2", "#f30-slot3", "#f30-chip", "#f30-status"],
            { opacity: 0, duration: 0.4, ease: MOVE }, 7.78);
      tl.to("#f30-spark", { opacity: 0, duration: 0.3, ease: MOVE }, 7.78);
      // the ring tilts flat (vertical radius 260 → 78) and sinks to become the spiral's base
      tl.to(["#f30-trail", "#f30-ghost"], { attr: { rx: 78 }, duration: 0.6, ease: MOVE }, 7.8);
      tl.to("#f30-ringwrap", { y: 250, duration: 0.6, ease: MOVE }, 7.8);
      // dùng @8.43 / càng @8.63 / nhiều @8.79
      tl.fromTo("#f30-u1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 8.432);
      tl.fromTo("#f30-u2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 8.633);
      tl.fromTo("#f30-u3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 8.794);
      tl.to(spiral, { opacity: 1, duration: 0.1, ease: IN }, S0);
      tl.to(spiral, { strokeDashoffset: 0, duration: SD, ease: "none" }, S0);
      tl.fromTo("#f30-m1", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, markTime(N * 0.4));
