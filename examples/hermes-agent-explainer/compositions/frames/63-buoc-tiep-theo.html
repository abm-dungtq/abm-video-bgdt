  <script>
    (function () {

      // measure a path prefix on a detached copy (deterministic geometry)
      function lenOf(svg, d) {
        var p = document.createElementNS(svg.namespaceURI, "path");
        p.setAttribute("d", d);
        svg.appendChild(p);
        var l = p.getTotalLength();
        svg.removeChild(p);
        return l;
      }
      // a courier = one gold trail + the winged spark riding its head
      function courier(svgId, trailId, sparkId, segs) {
        var svg = document.getElementById(svgId);
        var trail = document.getElementById(trailId);
        var spark = document.getElementById(sparkId);
        trail.setAttribute("d", segs.join(" "));
        var marks = [];
        for (var i = 1; i <= segs.length; i++) marks.push(lenOf(svg, segs.slice(0, i).join(" ")));
        var LT = trail.getTotalLength();
        marks[marks.length - 1] = LT;
        trail.style.strokeDasharray = LT + " " + (LT + 10);
        var st = { d: 0, s: 1 };
        function draw() {
          var d = Math.max(0, Math.min(LT, st.d));
          trail.style.strokeDashoffset = String(LT - d);
          var p = trail.getPointAtLength(d);
          var a = trail.getPointAtLength(Math.max(0, d - 2));
          var b = trail.getPointAtLength(Math.min(LT, d + 2));
          var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
          spark.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ") scale(" + st.s.toFixed(3) + ")");
        }
        draw();
        return { st: st, draw: draw, marks: marks, spark: spark };
      }

      // Scene 1 trail: from under the question down to badge 01, then down to badge 02
      var A = courier("f63-svg-a", "f63-trail-a", "f63-spark-a", [
        "M 880 190 C 880 290 360 240 360 355",
        "C 360 420 360 470 360 535"
      ]);
      // Scene 2 trail: underline that writes the payoff, then a curl and the fly-away
      var B = courier("f63-svg-b", "f63-trail-b", "f63-spark-b", [
        "M 250 468 C 560 448 1180 446 1470 458",
        "C 1560 462 1630 430 1622 382 C 1614 330 1548 336 1560 384 C 1574 440 1680 330 1730 150"
      ]);

      // initial hidden states (never tl.set at 0)
      gsap.set("#f63-s2", { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // dimmed field fades up (~40%)

      // ===== Scene 1 (0–4.25): kinetic beats =====
      // "Bước tiếp theo" lands big→small on "Bước" (0.29)
      tl.fromTo("#f63-q-text",

      // spark runs the trail down to badge 01, arriving on "cài" (1.35)

      tl.fromTo(A.st, { d: 0 }, { d: A.marks[0], duration: 0.3, ease: "power2.in", onUpdate: A.draw }, 1.05);
      tl.fromTo("#f63-b1", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 1.33);
      // "Cài" (1.35) then "Hermes" (1.55) slam in

      tl.fromTo("#f63-w-hermes",

      tl.fromTo(A.st, { d: A.marks[0] }, { d: A.marks[1], duration: 0.32, ease: "power2.inOut", onUpdate: A.draw, immediateRender: false }, 2.52);
      tl.to(A.spark, { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.86);
      tl.fromTo("#f63-b2", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.82);
      tl.fromTo("#f63-w-giao",

      // stage clears: zoom-through cut out of Scene 1

        { opacity: 1, scale: 1, filter: "blur(0px)" },

      tl.fromTo("#f63-s2", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 4.25);

      tl.fromTo(B.st, { d: B.marks[0], s: 1 }, { d: B.marks[1], s: 0.35, duration: 0.8, ease: "power2.in", onUpdate: B.draw, immediateRender: false }, 5.66);
      tl.to(B.spark, { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.16);

      tl.fromTo("#f63-final", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97, duration: 0.8, ease: "power2.inOut" }, 6.56);
      tl.to("#f63-dust", { opacity: 0.12, duration: 0.8, ease: "power2.inOut" }, 6.56);

      tl.to({}, { duration: D }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
