  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var NS = document.getElementById("f01-svg").namespaceURI;
      // courier route in stage coords: entry + loop (left margin), underline under "Hermes",
      // underline under "Agent", closing curl
      var SEG = [
        "M 70 720 C 160 760 250 720 270 620 C 285 540 210 500 170 550 C 130 600 190 660 250 610 C 300 570 300 480 345 448",
        "C 540 456 740 440 935 448",
        "C 1130 456 1300 440 1420 446",
        "C 1480 449 1520 420 1540 382 C 1556 350 1532 330 1510 350"
      ];
      var fullD = SEG.join(" ");
      var trail = document.getElementById("f01-trail");
      var spark = document.getElementById("f01-spark");
      trail.setAttribute("d", fullD);

      // prefix lengths (measured on detached paths — deterministic geometry)
      var svg = document.getElementById("f01-svg");
      function lenOf(d) {
        var p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        svg.appendChild(p);
        var l = p.getTotalLength();
        svg.removeChild(p);
        return l;
      }
      var L1 = lenOf(SEG.slice(0, 1).join(" "));
      var L2 = lenOf(SEG.slice(0, 2).join(" "));
      var L3 = lenOf(SEG.slice(0, 3).join(" "));
      var LT = trail.getTotalLength();

      trail.style.strokeDasharray = LT + " " + (LT + 10);
      var courier = { d: 0 };
      function draw() {
        var d = Math.max(0, Math.min(LT, courier.d));
        trail.style.strokeDashoffset = String(LT - d);
        var p = trail.getPointAtLength(d);
        var a = trail.getPointAtLength(Math.max(0, d - 2));
        var b = trail.getPointAtLength(Math.min(LT, d + 2));
        var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      draw();

      var tl = gsap.timeline({ paused: true });

      // background dust fades up (dimmed ~35%)
      tl.fromTo("#f01-dust", { opacity: 0 }, { opacity: 0.35, duration: 0.9, ease: "power2.out" }, 0);

      // Scene 1 — winged spark enters left, loops, heads for the wordmark
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 0.1);
      tl.fromTo(courier, { d: 0 }, { d: L1, duration: 2.2, ease: "power1.in", onUpdate: draw }, 0.1);

      // "bài học" kicker on its word
      tl.fromTo("#f01-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);

      // Scene 2 — trail writes "Hermes" (cue 2.39)
      tl.fromTo(courier, { d: L1 }, { d: L2, duration: 0.5, ease: "none", onUpdate: draw, immediateRender: false }, 2.3);
      tl.fromTo("#f01-w-hermes",
        { clipPath: "inset(-30% 100% -30% -10%)", y: 22 },
        { clipPath: "inset(-30% -10% -30% -10%)", y: 0, duration: 0.5, ease: "none" }, 2.3);

      // trail writes "Agent" (cue 2.88)
      tl.fromTo(courier, { d: L2 }, { d: L3, duration: 0.45, ease: "none", onUpdate: draw, immediateRender: false }, 2.8);
      tl.fromTo("#f01-w-agent",
        { clipPath: "inset(-30% 100% -30% -10%)", y: 22 },
        { clipPath: "inset(-30% -10% -30% -10%)", y: 0, duration: 0.45, ease: "none" }, 2.8);

      // closing curl
      tl.fromTo(courier, { d: L3 }, { d: LT, duration: 0.3, ease: "power3.out", onUpdate: draw, immediateRender: false }, 3.25);

      // glow blooms once behind the wordmark, then holds
      tl.fromTo("#f01-bloom", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.04, duration: 0.45, ease: "power3.out" }, 3.2);
      tl.to("#f01-bloom", { opacity: 0.75, scale: 1, duration: 0.3, ease: "power2.inOut" }, 3.65);

      // hairline + per-word subtitle rise
      tl.fromTo("#f01-hairline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.15);
      tl.fromTo("#f01-subtitle .f01-sw", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, 3.25);

      // held lockup: barely-perceptible settle under the hold
      tl.fromTo("#f01-lockup", { scale: 1.02 }, { scale: 1, duration: 1.7, ease: "power2.inOut" }, 2.3);

      tl.to({}, { duration: 4 }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["01-hermes-agent-tu-co-ban-den-nang-cao"] = tl;
    })();
