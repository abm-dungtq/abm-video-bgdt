    }
    #f40-ring-spin {

    #f40-decor {

  </style>

  <div id="root" data-composition-id="40-luon-ben-ban" data-width="1920" data-height="1080" data-duration="3.884">
    <div id="f40-ground" class="clip" data-start="0" data-duration="3.884" data-track-index="0">
      <div id="f40-glow-prev" class="f40-glow"></div>
      <div id="f40-glow-ch" class="f40-glow"></div>
    </div>
    <div id="f40-stage" class="clip" data-start="0" data-duration="3.884" data-track-index="1">
      <div id="f40-cam">
        <div id="f40-numeral">
          <div id="f40-bloom"></div>
          <div id="f40-ring-spin">
            <svg id="f40-decor" viewBox="0 0 660 660" width="660" height="660">
              <circle cx="330" cy="330" r="318" fill="none" stroke="rgba(244,241,232,0.10)" stroke-width="2" stroke-dasharray="2 12"></circle>
              <circle cx="330" cy="330" r="262" fill="none" stroke="rgba(142,147,181,0.10)" stroke-width="1.5"></circle>
            </svg>
          </div>
          <svg id="f40-glyph" viewBox="0 0 360 560" width="360" height="560">
            <defs>
              <linearGradient id="f40-fillgrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD23F" stop-opacity="0.30"></stop>
                <stop offset="1" stop-color="#FFD23F" stop-opacity="0.05"></stop>
              </linearGradient>
            </defs>
            <path id="f40-fill" fill="url(#f40-fillgrad)" stroke="none"></path>
            <path id="f40-trace" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>
            <g id="f40-spark">
              <circle cx="0" cy="0" r="16" fill="rgba(255,210,63,0.22)"></circle>
              <path d="M -3 -3 C -10 -16, -22 -17, -30 -10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>
              <path d="M -3 3 C -10 16, -22 17, -30 10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>

        <div id="f40-title-group">

          </div>
          <svg id="f40-under" viewBox="0 0 820 60" width="820" height="60">
            <path id="f40-under-path" d="M 0 30 C 180 50, 420 12, 800 28" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"></path>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.384;

      // numeral "5" outline (viewBox units = px), one closed contour: top bar, stem, bowl, tail.
      var PTS = [
        [60, 30], [320, 30], [320, 110], [145, 110], [138, 212],
        [200, 200], [265, 212], [315, 250], [340, 310], [342, 380], [325, 445],
        [285, 500], [225, 532], [160, 540], [95, 530], [40, 505],
        [60, 430], [110, 458], [165, 465], [215, 450], [250, 412], [262, 360],
        [252, 305], [222, 272], [175, 262], [125, 272], [85, 300], [60, 30]
      ];

      var cum = [0];
      var d = "M " + PTS[0][0] + " " + PTS[0][1];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
        d += " L " + PTS[i][0] + " " + PTS[i][1];
      }
      var LEN = cum[cum.length - 1];

      var trace = document.getElementById("f40-trace");
      var fill = document.getElementById("f40-fill");
      var spark = document.getElementById("f40-spark");
      trace.setAttribute("d", d);
      fill.setAttribute("d", d + " Z");
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);
      trace.setAttribute("stroke-dashoffset", LEN);

      // courier spark rides the head of the numeral trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var p0 = PTS[k - 1], p1 = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = p0[0] + (p1[0] - p0[0]) * t;
        var y = p0[1] + (p1[1] - p0[1]) * t;
        var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      // underline trail: fixed length bound (≥ true curve length) keeps it deterministic
      var ULEN = 860;
      var under = document.getElementById("f40-under-path");
      under.setAttribute("stroke-dasharray", ULEN + " " + ULEN);
      under.setAttribute("stroke-dashoffset", ULEN);

      gsap.set([spark, "#f40-kicker", "#f40-bloom", fill], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.33 s) — "Chương năm": hue shifts +12°, the trail writes a large "5"
      tl.fromTo("#f40-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f40-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f40-decor", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f40-ring-spin", { rotation: 0 }, { rotation: 24, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 1.1, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      // "năm" @ 1.04 — the written 5 fills and blooms as the trail closes
      tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.04);
      tl.fromTo("#f40-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.04);
      tl.to(spark, { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 1.22);

      // Scene 2 (1.33–3.384 s) — numeral settles left, "Luôn bên bạn" slides up word by word
      tl.fromTo("#f40-numeral", { x: 260, scale: 1.1 }, { x: 0, scale: 0.92, duration: 0.55, ease: "power2.inOut" }, 1.33);
      tl.fromTo("#f40-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.5);
      // "luôn" @ 2.12, "bên" @ 2.28, "bạn" @ 2.42
      tl.fromTo("#f40-w1", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.1);
      tl.fromTo("#f40-w2", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.26);
      tl.fromTo("#f40-w3", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.4);
      // the courier trail underlines the promise
      tl.fromTo(under, { attr: { "stroke-dashoffset": ULEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "none" }, 2.5);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f40-cam", { scale: 1 }, { scale: 1.01, duration: DUR - 2.9, ease: "none" }, 2.9);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["40-luon-ben-ban"] = tl;
    })();
  </script>
