  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var q = function (id) { return document.getElementById(id); };
      // dash-prime every path that draws on (initial hidden state before the timeline)
      var drawIds = ["f23-hl-o","f23-hl-c","f23-hr-o","f23-hr-c","f23-ul",
        "f23-i1a","f23-i1b","f23-i2a","f23-i2b","f23-i3a","f23-i4a","f23-i4b","f23-i5a","f23-i5b","f23-i6a","f23-i6b",

      var len = {};
      drawIds.forEach(function (id) {
        var el = q(id);
        var L = Math.ceil(el.getTotalLength()) + 2;
        len[id] = L;
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L });
      });

      var tl = gsap.timeline({ paused: true });
      function draw(id, t, d) {
        tl.fromTo(q(id), { strokeDashoffset: len[id] }, { strokeDashoffset: 0, duration: d, ease: "none" }, t);
      }

      /* ---------- Scene 1 (0–2.32): two open hands, "đôi tay của agent" ---------- */
      tl.fromTo("#f23-ghost", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05);
      tl.fromTo("#f23-k1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.31);

      draw("f23-hr-o", 1.01, 0.75);
      draw("f23-hl-c", 1.45, 0.35);
      draw("f23-hr-c", 1.6, 0.35);
      tl.fromTo("#f23-w1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.85);
      tl.fromTo("#f23-w2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.01);
      tl.fromTo("#f23-w3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.29);
      tl.fromTo("#f23-w4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.64);
      draw("f23-ul", 1.64, 0.5);

      /* ---------- Scene 2 (2.32–7.62): hands open into the grid, cards deal in ---------- */
      // title swaps out (zoom-through style), ghost clears
      tl.fromTo("#f23-title", { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0, scale: 0.94, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 2.32);
      tl.fromTo("#f23-ghost", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.32);
      // the hands open outward, then lift to become the header glyph
      tl.fromTo("#f23-hl", { x: 0, rotation: 0, svgOrigin: "250 400" }, { x: -40, rotation: -10, svgOrigin: "250 400", duration: 0.5, ease: "power2.inOut" }, 2.32);
      tl.fromTo("#f23-hr", { x: 0, rotation: 0, svgOrigin: "450 400" }, { x: 40, rotation: 10, svgOrigin: "450 400", duration: 0.5, ease: "power2.inOut" }, 2.32);
      tl.fromTo("#f23-hands", { scale: 1, y: 0 }, { scale: 0.36, y: -175, duration: 0.65, ease: "power2.inOut" }, 2.45);
      tl.to(["#f23-hl-o","#f23-hl-c","#f23-hr-o","#f23-hr-c"], { stroke: "#F4F1E8", duration: 0.5, ease: "power2.out" }, 2.6);
      // kicker swap on "Hermes"
      tl.fromTo("#f23-k1", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 2.64);
      tl.fromTo("#f23-k2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.72);
      // empty 3x2 grid of slots is established
      ["#f23-s1","#f23-s2","#f23-s3","#f23-s4","#f23-s5","#f23-s6"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.8 + i * 0.07);
      });

      // cards deal in from the hands, each on its cue
      var deals = [3.62, 5.6, 6.73, 8.35, 8.95, 10.04];
      var cx = [300, 880, 1460, 300, 880, 1460];
      var rot = [-4, 0, 4, -3, 0, 3];
      deals.forEach(function (t, i) {
        var n = i + 1;
        var card = "#f23-card" + n;
        draw("f23-tr" + n, t - 0.05, 0.35);
        tl.fromTo("#f23-tr" + n, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t + 0.8);
        tl.fromTo(card, { opacity: 0, y: -50, x: (880 - cx[i]) * 0.12, scale: 0.9, rotation: rot[i] },
          { opacity: 1, y: 0, x: 0, scale: 1, rotation: 0, duration: 0.55, ease: "power3.out" }, t);
        // single gold focus: the newest card
        tl.fromTo(card + " .f23-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t + 0.05);
        if (i < deals.length - 1) {
          tl.fromTo(card + " .f23-glow", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, deals[i + 1]);
        }
      });
      // icons draw on their spoken word
      draw("f23-i1a", 3.66, 0.5);          // đọc
      draw("f23-i1b", 4.24, 0.35);         // ghi (pencil)
      draw("f23-i2a", 5.64, 0.45);         // terminal
      draw("f23-i2b", 5.9, 0.3);
      draw("f23-i3a", 6.95, 0.55);         // web
      draw("f23-i4a", 8.59, 0.45);         // ảnh
      draw("f23-i4b", 8.85, 0.25);
      draw("f23-i5a", 9.15, 0.45);         // ảnh
      draw("f23-i5b", 9.4, 0.3);
      draw("f23-i6a", 10.26, 0.4);         // code

      tl.fromTo("#f23-chip-py", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 10.48);

      tl.to(["#f23-card1","#f23-card2","#f23-card3"], { opacity: 0.45, duration: 0.45, ease: "power2.out" }, 7.73);
