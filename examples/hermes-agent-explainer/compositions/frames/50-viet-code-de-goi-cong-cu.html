      var arrowsG = q("#f50-arrows");

        var col = call ? "#f4f1e8" : "#3ee6d0";
        var ln = document.createElementNS(SVGNS, "path");
        ln.setAttribute("d", "M " + x1 + " " + y + " L " + x2 + " " + y);

        ln.setAttribute("fill", "none");
        ln.setAttribute("pathLength", "1");
        ln.setAttribute("stroke-dasharray", "1");
        ln.setAttribute("stroke-dashoffset", "1");
        ln.setAttribute("opacity", call ? "0.85" : "1");
        arrowsG.appendChild(ln);
        arrows.push(ln);
        var hd = document.createElementNS(SVGNS, "polygon");
        var tip = call ? 624 : 176, back = call ? 606 : 194;
        hd.setAttribute("points", tip + "," + y + " " + back + "," + (y - 8) + " " + back + "," + (y + 8));
        hd.setAttribute("fill", col);
        hd.setAttribute("opacity", "0");

        if (call) {

          dt.setAttribute("cx", "170"); dt.setAttribute("cy", String(y)); dt.setAttribute("r", "9");
          dt.setAttribute("fill", "#ffd23f"); dt.setAttribute("opacity", "0");
          arrowsG.appendChild(dt);
          turnDots.push(dt);
        }
      }

      /* ---- build typed Python lines (tool names from the code-execution docs) ---- */
      var lines = [
        [["a", ""], [" = ", "f50-op"], ["web_search", "f50-fn"], ["(q)", "f50-op"]],
        [["b", ""], [" = ", "f50-op"], ["read_file", "f50-fn"], ["(path)", "f50-op"]],
        [["c", ""], [" = ", "f50-op"], ["terminal", "f50-fn"], ["(cmd)", "f50-op"]],
        [["print", "f50-fn"], ["(a, b, c)", "f50-op"]]

      tl.fromTo("#f50-card", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.36);
      var lineStarts = [2.68, 3.24, 3.72, 4.3];

        var per = Math.min(0.028, 0.44 / chars.length);
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, lineStarts[li]);
      });

      // "gọi nhiều công cụ" → tool lane + zig-zag of back-and-forth steps
      tl.fromTo("#f50-lab-t", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.51);

        var t = 3.51 + i * 0.2;
        tl.fromTo(a, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.17, ease: "none" }, t);
        tl.fromTo(heads[i], { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, t + 0.15);
