  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var GOLD = "#ffd23f", CYAN = "#3ee6d0", INK = "#f4f1e8";
      var CARD_BORDER = "rgba(244, 241, 232, 0.12)";
      gsap.set(".f57-segfill", { scaleX: 0, transformOrigin: "0% 50%" });
      var tl = gsap.timeline({ paused: true });

      // Background field settles in underneath (dimmed ~40%).
      tl.fromTo("#f57-field", { opacity: 0 }, { opacity: 0.4, duration: 0.6, ease: "power2.inOut" }, 0);

      // "Năm" (0.31): the anchor lands once and PINS — no movement after this.
      tl.fromTo("#f57-anchor", { opacity: 0, scale: 0.94, transformOrigin: "0% 50%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.31);
      // "điểm nổi bật" (0.47–0.91)
      tl.fromTo("#f57-head", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.47);
      tl.fromTo(["#f57-ticks", "#f57-count"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.08 }, 0.79);
      // five empty slots wait for the items
      tl.fromTo(".f57-row", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0.85);

      // Each spoken item ticks its row: card slides in, check pops, tick draws,
      // label takes the gold focus, the anchor's progress segment fills, the trail
      // walks down to the row's node.
      var cues = [1.333, 2.074, 3.277, 4.019, 5.222];
      var TRAIL = 608, STEP = 152;
      cues.forEach(function (t, i) {
        tl.fromTo("#f57-card" + i, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
        tl.set("#f57-card" + i, { borderColor: GOLD }, t);
        tl.set("#f57-label" + i, { color: GOLD }, t);
        tl.fromTo("#f57-check" + i, { scale: 0.6, rotation: -18, transformOrigin: "50% 50%" },
          { scale: 1, rotation: 0, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo("#f57-tick" + i, { strokeDashoffset: 36 }, { strokeDashoffset: 0, duration: 0.3, ease: "none" }, t + 0.12);
        tl.fromTo("#f57-fill" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, t);
        tl.set("#f57-countn", { textContent: String(i + 1) }, t);
        tl.fromTo("#f57-node" + i, { opacity: 0, scale: 0, svgOrigin: "20 " + (104 + STEP * i) },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, t);
        if (i > 0) {
          tl.fromTo("#f57-trailline", { strokeDashoffset: TRAIL - STEP * (i - 1) },
            { strokeDashoffset: TRAIL - STEP * i, duration: 0.3, ease: "none" }, t);
          // the previous item settles into "done"
          tl.set("#f57-label" + (i - 1), { color: INK }, t);
          tl.set("#f57-card" + (i - 1), { borderColor: CARD_BORDER }, t);
        }
      });

      // Emphasis beat after "SOUL.md." ends (6.02): the list is complete —
      // every row snaps to "ok" cyan together and the anchor number takes the gold.
      var R = 6.08;
      tl.set("#f57-label4", { color: INK }, R);
      tl.set(".f57-card", { borderColor: "rgba(62, 230, 208, 0.55)" }, R);
      tl.set("#f57-countn", { color: CYAN }, R);
      tl.set("#f57-num", { color: GOLD }, R);
      tl.fromTo("#f57-num", { filter: "drop-shadow(0 0 0px rgba(255,210,63,0))" },
        { filter: "drop-shadow(0 0 18px rgba(255,210,63,.55))", duration: 0.45, ease: "power3.out" }, R);

      // Hold still to the end (no exit; the root transition is the exit).
      tl.to({}, { duration: 6.944 }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["57-tom-tat-chuong-sau"] = tl;
    })();
  </script>
