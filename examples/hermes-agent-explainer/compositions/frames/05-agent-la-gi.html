<template>
  <style>
    @font-face{font-family:"Be Vietnam Pro";font-weight:800;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype");}
    @font-face{font-family:"Be Vietnam Pro";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-Medium.ttf") format("truetype");}
    @font-face{font-family:"Be Vietnam Pro";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype");}
    @font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype");}
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #f4f1e8;
      font-family: "Be Vietnam Pro", sans-serif;
      --canvas: #0b1026; --surface: #141b3a; --ink: #f4f1e8; --gold: #ffd23f;
      --cyan: #3ee6d0; --warn: #ff6b6b; --muted: #8e93b5;
    }
    /* full-bleed ground on its own clip (never on #root); H = 230 + 12 × chapter */
    #f05-ground {
      position: absolute;
      inset: 0;
      background: var(--canvas);
    }
    /* hue shift +12°: the previous chapter's glow (H 230) hands over to ch1 (H 242) */
    #f05-ground .f05-glow {
      position: absolute;
      inset: 0;
    }
    #f05-glow-prev {
      background: radial-gradient(ellipse at 70% 30%, hsla(230, 70%, 45%, 0.28), transparent 60%);
    }
    #f05-glow-ch {
      background: radial-gradient(ellipse at 70% 30%, hsla(242, 70%, 45%, 0.28), transparent 60%);
    }
    /* the stage: safe area x 80–1840, y 60–880 */
    #f05-stage {
      position: absolute;
      left: 80px;
      top: 60px;
      width: 1760px;
      height: 820px;
    }
    /* frame-specific styles below — prefix every id/class with f05- */
    #f05-cam {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    /* numeral group: 300×560 box, 1:1 with the SVG viewBox */
    #f05-numeral {
      position: absolute;
      left: 380px;
      top: 130px;
      width: 300px;
      height: 560px;
      transform-origin: 150px 280px;
    }
    #f05-bloom {
      position: absolute;
      left: -210px;
      top: -70px;
      width: 720px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 210, 63, 0.22), rgba(255, 210, 63, 0.06) 55%, transparent 100%);
    }
    #f05-ring-spin {
      position: absolute;
      left: -180px;
      top: -50px;
      width: 660px;
      height: 660px;
    }
    #f05-ring {
      position: absolute;
      left: 0;
      top: 0;
      width: 660px;
      height: 660px;
      overflow: visible;
    }
    #f05-glyph {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 560px;
      overflow: visible;
    }
    #f05-trace {
      filter: drop-shadow(0 0 12px rgba(255, 210, 63, 0.55));
    }
    /* title block beside the numeral */
    #f05-title-group {
      position: absolute;
      left: 780px;
      top: 318px;
    }
    #f05-kicker {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }
    .f05-diamond {
      display: block;
      width: 12px;
      height: 12px;
      background: var(--gold);
      transform: rotate(45deg);
    }
    #f05-title-mask {
      margin-top: 14px;
      overflow: hidden;
      padding: 10px 8px 14px 0;
    }
    #f05-title {
      font-size: 96px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: var(--ink);
    }
    #f05-hair-wrap {
      position: relative;
      margin-top: 8px;
      height: 3px;
      width: 100%;
    }
    #f05-hairline {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: var(--gold);
      transform-origin: 0 50%;
      filter: drop-shadow(0 0 10px rgba(255, 210, 63, 0.55));
    }
    #f05-hair-mover { position: absolute; left: 0; top: 0; width: 100%; height: 3px; }
    #f05-hair-head {
      position: absolute;
      top: -6px;
      left: 0;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px 4px rgba(255, 210, 63, 0.6);
    }
  </style>

  <div id="root" data-composition-id="05-agent-la-gi" data-width="1920" data-height="1080" data-duration="3.511">
    <div id="f05-ground" class="clip" data-start="0" data-duration="3.511" data-track-index="0">
      <div id="f05-glow-prev" class="f05-glow"></div>
      <div id="f05-glow-ch" class="f05-glow"></div>
    </div>
    <div id="f05-stage" class="clip" data-start="0" data-duration="3.511" data-track-index="1">
      <div id="f05-cam">
        <div id="f05-numeral">
          <div id="f05-bloom"></div>
          <div id="f05-ring-spin">
          <svg id="f05-ring" viewBox="0 0 660 660" width="660" height="660">
            <circle cx="330" cy="330" r="318" fill="none" stroke="rgba(244,241,232,0.10)" stroke-width="2" stroke-dasharray="2 12"></circle>
            <circle cx="330" cy="330" r="270" fill="none" stroke="rgba(142,147,181,0.10)" stroke-width="1.5"></circle>
          </svg>
          </div>
          <svg id="f05-glyph" viewBox="0 0 300 560" width="300" height="560">
            <defs>
              <linearGradient id="f05-fillgrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD23F" stop-opacity="0.30"></stop>
                <stop offset="1" stop-color="#FFD23F" stop-opacity="0.05"></stop>
              </linearGradient>
            </defs>
            <path id="f05-fill" fill="url(#f05-fillgrad)" stroke="none"></path>
            <path id="f05-trace" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>
            <g id="f05-spark">
              <circle cx="0" cy="0" r="16" fill="rgba(255,210,63,0.22)"></circle>
              <path d="M -3 -3 C -10 -16, -22 -17, -30 -10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>
              <path d="M -3 3 C -10 16, -22 17, -30 10" fill="none" stroke="#F4F1E8" stroke-width="2.5" stroke-linecap="round"></path>
              <circle cx="0" cy="0" r="7" fill="#FFD23F"></circle>
            </g>
          </svg>
        </div>

        <div id="f05-title-group">
          <div id="f05-kicker"><span class="f05-diamond"></span><span>Chương 1</span></div>
          <div id="f05-title-mask">
            <div id="f05-title">Agent là gì?</div>
          </div>
          <div id="f05-hair-wrap">
            <div id="f05-hairline"></div>
            <div id="f05-hair-mover"><div id="f05-hair-head"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.011;

      // numeral "1" outline (viewBox units = px), traced from the flag tip and closing back on it
      var PTS = [[50, 95], [150, 20], [220, 20], [220, 540], [130, 540], [130, 130], [50, 185], [50, 95]];
      var cum = [0];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      var LEN = cum[cum.length - 1];
      var d = "M " + PTS[0][0] + " " + PTS[0][1];
      for (var j = 1; j < PTS.length; j++) d += " L " + PTS[j][0] + " " + PTS[j][1];
      d += " Z";

      var trace = document.getElementById("f05-trace");
      var fill = document.getElementById("f05-fill");
      var spark = document.getElementById("f05-spark");
      trace.setAttribute("d", d);
      fill.setAttribute("d", d);
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);

      // courier spark rides the head of the trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var a = PTS[k - 1], b = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = a[0] + (b[0] - a[0]) * t;
        var y = a[1] + (b[1] - a[1]) * t;
        var ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.28 s) — "Chương một": hue shifts +12°, the trail writes a large "1"
      tl.fromTo("#f05-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 0);
      tl.fromTo("#f05-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 0);
      tl.fromTo("#f05-ring", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f05-ring-spin", { rotation: 0 }, { rotation: 24, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 1.1, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.05);
      tl.fromTo("#f05-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.95);

      // Scene 2 (1.28–3.01 s) — the numeral glides left, the spark hands the baton to the hairline
      tl.fromTo("#f05-numeral", { x: 200, scale: 1.1 }, { x: 0, scale: 0.9, duration: 0.6, ease: "power2.inOut" }, 1.28);
      tl.to(spark, { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 1.3);
      tl.fromTo("#f05-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.4);
      // "agent" @ 1.57 — the title slides up from its mask
      tl.fromTo("#f05-title", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.55);
      tl.fromTo("#f05-hairline", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "none" }, 1.8);
      tl.fromTo("#f05-hair-mover", { xPercent: 0 }, { xPercent: 100, duration: 0.55, ease: "none" }, 1.8);
      tl.fromTo("#f05-hair-head", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.8);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f05-cam", { scale: 1 }, { scale: 1.012, duration: DUR - 1.9, ease: "none" }, 1.9);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["05-agent-la-gi"] = tl;
    })();
  </script>
</template>
