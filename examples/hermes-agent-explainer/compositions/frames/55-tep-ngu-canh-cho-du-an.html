  <script>
    (function () {
      var GOLD = "#ffd23f", CANVAS = "#0b1026", INK = "#f4f1e8";
      var bars = ["#f55-b00","#f55-b01","#f55-b02","#f55-b10","#f55-b11","#f55-b12","#f55-b20","#f55-b21","#f55-b22"];

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0–3.94): rail 1, folder tree draws, AGENTS.md cards stack ---------- */
      tl.set("#f55-num1", { backgroundColor: GOLD, borderColor: GOLD, color: CANVAS }, 0.2);
      tl.set("#f55-txt1", { color: GOLD }, 0.2);

      // tree: root first, the trail carries down to the working folder
      tl.fromTo("#f55-node0", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(["#f55-ph0", "#f55-ph1", "#f55-ph2"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 0.45);
      tl.fromTo("#f55-trail1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "none" }, 0.63);
      tl.fromTo("#f55-node1", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.2);
      tl.fromTo("#f55-trail2", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 1.4);
      tl.fromTo("#f55-node2", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.85);

      // "AGENTS.md" @2.15 — cards drop into their slots, root to working folder
      tl.fromTo("#f55-card0", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.15);
      tl.fromTo("#f55-card1", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.42);
      tl.fromTo("#f55-card2", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.69);

      // "trong thư mục dự án" @3.28 — file contents fill in
      tl.fromTo(["#f55-b00","#f55-b01","#f55-b02"], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 3.28);
      tl.fromTo(["#f55-b10","#f55-b11","#f55-b12"], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 3.44);
      tl.fromTo(["#f55-b20","#f55-b21","#f55-b22"], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 3.6);

      // "thư mục dự án" @3.46 — the levels get their names
      tl.fromTo(["#f55-lab0", "#f55-lab1", "#f55-lab2"], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 3.46);

      /* ---------- Scene 2 (3.94–8.37): rail 2, rule chips, "không cần nhắc lại" ---------- */
      tl.set("#f55-num1", { backgroundColor: "rgba(0,0,0,0)", borderColor: INK, color: INK }, 3.94);
      tl.set("#f55-txt1", { color: INK }, 3.94);
      tl.set("#f55-num2", { backgroundColor: GOLD, borderColor: GOLD, color: CANVAS }, 3.94);
      tl.set("#f55-txt2", { color: GOLD }, 3.94);
      tl.to("#f55-railbar", { x: 366, duration: 0.5, ease: "power2.inOut" }, 3.94);

      // "hiểu" 5.26 · "quy" 5.44 · "tắc" 5.60
      tl.fromTo("#f55-chip0", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.26);
      tl.fromTo("#f55-chip1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.44);
      tl.fromTo("#f55-chip2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.6);

      // "của từng dự án" — the rules from every level flow together
      tl.fromTo(["#f55-merge0", "#f55-merge1", "#f55-merge2"], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "none", stagger: 0.08 }, 5.9);

      tl.fromTo("#f55-tag", { opacity: 0, scale: 0.8, x: -16 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: "power3.out" }, 6.85);

      /* ---------- Scene 3 (8.37–12.88): rail 3, push onto the stack, scan + block ---------- */
      tl.set("#f55-num2", { backgroundColor: "rgba(0,0,0,0)", borderColor: INK, color: INK }, 8.37);
      tl.set("#f55-txt2", { color: INK }, 8.37);

      tl.set("#f55-txt3", { color: GOLD }, 8.37);

      tl.to(["#f55-tree", "#f55-merge-svg", "#f55-tag"], { opacity: 0.22, duration: 0.5, ease: "power2.inOut" }, 8.4);
      tl.fromTo("#f55-world", { scale: 1 }, { scale: 1.15, duration: 1.3, ease: "power2.inOut" }, 8.4);
