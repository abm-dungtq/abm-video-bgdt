  <script>
    (function () {
      var D = 9.277;
      var GOLD = "#ffd23f", CYAN = "#3ee6d0", MUTED = "#8e93b5", INK = "#f4f1e8";

      // ring segments: 7 arcs, clockwise from top, radius 250 around (280, 280)
      var R = 250, CX = 280, CY = 280, GAP = 7;
      for (var i = 0; i < 7; i++) {
        var a0 = (-90 + i * (360 / 7) + GAP / 2) * Math.PI / 180;
        var a1 = (-90 + (i + 1) * (360 / 7) - GAP / 2) * Math.PI / 180;
        var d = "M " + (CX + R * Math.cos(a0)).toFixed(2) + " " + (CY + R * Math.sin(a0)).toFixed(2) +
          " A " + R + " " + R + " 0 0 1 " + (CX + R * Math.cos(a1)).toFixed(2) + " " + (CY + R * Math.sin(a1)).toFixed(2);
        document.getElementById("f52-s" + (i + 1)).setAttribute("d", d);
      }

      // connectors from the (scaled) ring edge at hub centre (880, 370) to each tile's inner edge
      var HX = 880, HY = 370, R0 = 172;
      var anchors = [[460, 205], [460, 365], [460, 525], [880, 640], [1300, 205], [1300, 365], [1300, 525]];
      for (var j = 0; j < 7; j++) {
        var ax = anchors[j][0], ay = anchors[j][1];
        var dx = ax - HX, dy = ay - HY, len = Math.sqrt(dx * dx + dy * dy);
        var sx = HX + dx / len * R0, sy = HY + dy / len * R0;
        if (j === 3) { sy = 606; } // bottom link starts below the scaled label
        document.getElementById("f52-l" + (j + 1)).setAttribute("d",
          "M " + sx.toFixed(1) + " " + sy.toFixed(1) + " L " + ax + " " + ay);
      }

      var tl = gsap.timeline({ paused: true });

      // slow continuous camera push-in under everything
      tl.fromTo("#f52-cam", { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

      // ---- Scene 1 (0–4.36): rail ① lights, "7" counts up and lands on "bảy" ----
      tl.fromTo("#f52-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.33);
      tl.fromTo("#f52-rail", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.33);
      tl.to("#f52-r1", { color: GOLD, borderColor: GOLD, duration: 0.3, ease: "power2.out" }, 0.57);

      tl.fromTo("#f52-orbit", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 0.33);
      // number appears on "Hermes", counts 0 → 7 with scale growing, lands on "bảy" (1.65)
      tl.fromTo("#f52-num", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 1.09);
      tl.fromTo("#f52-num", { textContent: 0 }, { textContent: 7, snap: { textContent: 1 }, duration: 0.56, ease: "power2.out" }, 1.09);
      tl.fromTo("#f52-num", { scale: 0.5 }, { scale: 1, duration: 0.56, ease: "power2.out" }, 1.09);
      for (var k = 1; k <= 7; k++) {
        tl.fromTo("#f52-s" + k, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.14, ease: "none" }, 1.09 + (k - 1) * 0.075);
      }
      tl.fromTo("#f52-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 1.65);

      // label on "môi trường" (1.88) and "chạy lệnh" (2.46); courier trail underline
      tl.fromTo("#f52-lw1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.88);
      tl.fromTo("#f52-lw2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.46);
      tl.fromTo("#f52-trail-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 2.62);

      // ---- Scene 2 (4.36–9.28): hub shrinks to the centre, tiles assemble around it ----
      tl.fromTo("#f52-hub", { scale: 1 }, { scale: 0.62, duration: 0.6, ease: "power2.inOut" }, 4.2);
      tl.to("#f52-trail-path", { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.2);
      tl.to("#f52-bloom", { opacity: 0.55, duration: 0.6, ease: "power2.inOut" }, 4.2);

      // rail: ① done, ② active
      tl.to("#f52-r1", { color: INK, borderColor: "rgba(244,241,232,0.35)", duration: 0.3, ease: "power2.out" }, 4.36);
      tl.to("#f52-r2", { color: GOLD, borderColor: GOLD, duration: 0.3, ease: "power2.out" }, 4.36);

      function tileIn(n, t, fromX, fromY, quiet) {
        var id = "#f52-t" + n;
        tl.fromTo(id, { opacity: 0, x: fromX, y: fromY, scale: 0.92 },
          { opacity: quiet ? 0.82 : 1, x: 0, y: 0, scale: 1, duration: quiet ? 0.7 : 0.5, ease: "power3.out" }, t);
        tl.fromTo("#f52-l" + n, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "none" }, t);
        tl.to("#f52-s" + n, { stroke: CYAN, duration: 0.3, ease: "power2.out" }, t + 0.1);
      }
      tileIn(1, 4.36, 70, 0, false);   // máy của bạn
      tileIn(2, 4.46, 70, 0, false);   // Docker (cue 4.36)
      tileIn(3, 5.21, 70, 0, false);   // SSH
      tileIn(4, 6.11, 0, -50, true);   // Singularity — fills quietly
      tileIn(5, 7.51, -70, 0, false);  // Modal
      tileIn(6, 8.12, -70, 0, false);  // Daytona
      tileIn(7, 8.34, -70, 0, true);   // Vercel Sandbox — fills quietly

      // rail: ② done, ③ active on "đám mây"
      tl.to("#f52-r2", { color: INK, borderColor: "rgba(244,241,232,0.35)", duration: 0.3, ease: "power2.out" }, 6.81);
      tl.to("#f52-r3", { color: GOLD, borderColor: GOLD, duration: 0.3, ease: "power2.out" }, 6.81);

      tl.to({}, { duration: D }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["52-bay-moi-truong-chay-lenh"] = tl;
    })();
