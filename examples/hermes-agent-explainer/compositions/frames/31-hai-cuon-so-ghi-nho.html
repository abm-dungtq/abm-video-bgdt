    .f31-cap {

      color: var(--muted); text-transform: uppercase; white-space: nowrap;
    }
    .f31-cap b { color: var(--ink); font-weight: 400; }
  </style>

  <div id="root" data-composition-id="31-hai-cuon-so-ghi-nho" data-width="1920" data-height="1080" data-duration="14.99">

            <div id="f31-L4" class="f31-line f31-l4"></div>
            <div id="f31-GL1" class="f31-gold f31-l1"></div>

            <div id="f31-ML1" class="f31-mark" style="top:180px">◆</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // initial hidden states (set before the timeline is built)
      gsap.set(["#f31-kd", "#f31-k1", "#f31-kg", "#f31-pill", "#f31-first",
                "#f31-tabL", "#f31-titleL", "#f31-tabR", "#f31-titleR",
                "#f31-spark", "#f31-trackL", "#f31-trackR", "#f31-capL", "#f31-capR"], { opacity: 0 });
      gsap.set(["#f31-L1", "#f31-L2", "#f31-L3", "#f31-L4", "#f31-R1", "#f31-R2", "#f31-R3", "#f31-R4",
                "#f31-fillL", "#f31-fillR"], { scaleX: 0 });
      gsap.set(["#f31-tickL", "#f31-tickR"], { scaleY: 0 });
      gsap.set("#f31-spark", { x: 192, y: 346 });

      var tl = gsap.timeline({ paused: true });
      var IN = "power3.out", MOVE = "power2.inOut";

      /* ---- Scene 1 (0–1.92): two closed notebooks slide in from opposite sides; kicker ---- */
      tl.fromTo("#f31-bookL", { x: -1000, opacity: 0 }, { x: 0, opacity: 1, duration: 0.84, ease: IN }, 0.3);
      tl.fromTo("#f31-bookR", { x: 1000, opacity: 0 }, { x: 0, opacity: 1, duration: 0.84, ease: IN }, 0.3);
      tl.fromTo("#f31-kd", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, 0.94);   // hai
      tl.fromTo("#f31-k1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.94);            // hai cuốn sổ
      tl.fromTo("#f31-kg", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 1.48);            // ghi nhớ

      /* ---- Scene 2 (1.92–5.36): covers open — MEMORY.md on "công việc", USER.md on "bạn" ---- */
      tl.fromTo("#f31-coverL", { rotationY: 0 }, { rotationY: -180, duration: 0.5, ease: MOVE }, 2.81);
      tl.fromTo("#f31-coverL", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 3.21);
      tl.fromTo("#f31-titleL", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, 3.29);        // công việc
      tl.fromTo("#f31-tabL", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 3.35);
      tl.fromTo(["#f31-L1", "#f31-L2", "#f31-L3", "#f31-L4"], { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: IN, stagger: 0.12 }, 3.55);

      tl.fromTo("#f31-coverR", { rotationY: 0 }, { rotationY: -180, duration: 0.5, ease: MOVE }, 4.88);
      tl.fromTo("#f31-coverR", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 5.28);
      tl.fromTo("#f31-titleR", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, 5.36);        // bạn
      tl.fromTo("#f31-tabR", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 5.42);
      tl.fromTo(["#f31-R1", "#f31-R2", "#f31-R3", "#f31-R4"], { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: IN, stagger: 0.12 }, 5.6);

      /* ---- Scene 3 (5.36–10.8): "phiên mới" chip; camera zooms in; spark reads first lines ---- */
      tl.to("#f31-kick", { opacity: 0, y: -16, duration: 0.25, ease: MOVE }, 6.05);
      tl.fromTo("#f31-pill", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: IN }, 6.32); // phiên (mới)
      tl.fromTo("#f31-cam", { scale: 1 }, { scale: 1.12, duration: 1.4, ease: MOVE }, 7.57);                       // Hermes đọc
      tl.fromTo("#f31-spark", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: IN }, 7.95);
      tl.fromTo("#f31-trail", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 1.12, ease: "none" }, 8.15);
      // spark rides the trail head: line 1 left → hop → line 1 right (lands on "tiên" @9.27)
      tl.fromTo("#f31-spark", { x: 192, y: 346 }, { x: 712, y: 346, duration: 0.45, ease: "none" }, 8.15);
      tl.to("#f31-spark", { x: 832, y: 278, duration: 0.11, ease: "none" }, 8.6);
      tl.to("#f31-spark", { x: 952, y: 346, duration: 0.11, ease: "none" }, 8.71);
      tl.to("#f31-spark", { x: 1472, y: 346, duration: 0.45, ease: "none" }, 8.82);
      tl.fromTo("#f31-L1", { opacity: 0.5 }, { opacity: 1, duration: 0.45, ease: "none" }, 8.15);
      tl.fromTo("#f31-R1", { opacity: 0.5 }, { opacity: 1, duration: 0.45, ease: "none" }, 8.82);
      tl.fromTo("#f31-first", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: IN }, 9.13);          // trước tiên

      /* ---- Scene 4 (10.8–14.49): capacity bars fill to the limit; only "quan trọng" lines stay lit ---- */
      tl.to("#f31-cam", { scale: 1, duration: 0.8, ease: MOVE }, 10.0);
      tl.to("#f31-spark", { opacity: 0, duration: 0.35, ease: MOVE }, 10.0);
      tl.to("#f31-trail", { opacity: 0.3, duration: 0.35, ease: MOVE }, 10.0);
      tl.fromTo(["#f31-trackL", "#f31-trackR"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 10.6);
      tl.fromTo(["#f31-fillL", "#f31-fillR"], { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.out" }, 10.8); // giới hạn
      tl.fromTo(["#f31-capL", "#f31-capR"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 10.94);
      tl.fromTo(["#f31-tickL", "#f31-tickR"], { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: IN }, 11.2);         // độ dài
      tl.to("#f31-pill", { opacity: 0.45, duration: 0.4, ease: MOVE }, 10.8);

      tl.to(["#f31-L2", "#f31-L4", "#f31-R2", "#f31-R4"], { opacity: 0.15, duration: 0.45, ease: MOVE }, 12.65);   // chỉ ghi
      tl.to(["#f31-L3", "#f31-R3"], { opacity: 0.8, duration: 0.45, ease: MOVE }, 12.65);
      tl.fromTo(["#f31-GL1", "#f31-GR1", "#f31-GL3", "#f31-GR3"], { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.35, ease: IN, stagger: 0.05 }, 13.37);                                   // quan trọng
      tl.fromTo(["#f31-ML1", "#f31-MR1", "#f31-ML3", "#f31-MR3"], { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.3, ease: IN, stagger: 0.05 }, 13.45);

      tl.to({}, { duration: 14.49 }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["31-hai-cuon-so-ghi-nho"] = tl;
    })();
  </script>
