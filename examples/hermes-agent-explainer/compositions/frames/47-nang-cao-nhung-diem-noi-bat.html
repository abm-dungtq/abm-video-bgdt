  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 3.56;

      // numeral "6" written as one stroke (viewBox units = px): hook, down-stroke, bowl, closing into the stem.
      var PTS = [
        [300, 70], [250, 40], [190, 32], [135, 50], [95, 95], [68, 160], [55, 240],
        [55, 330], [65, 410], [95, 475], [145, 520], [200, 535], [255, 522], [298, 485],
        [322, 430], [325, 375], [305, 320], [265, 285], [210, 272], [155, 280], [110, 310],
        [75, 360], [62, 410]
      ];

      var cum = [0];
      var d = "M " + PTS[0][0] + " " + PTS[0][1];
      for (var i = 1; i < PTS.length; i++) {
        var dx = PTS[i][0] - PTS[i - 1][0];
        var dy = PTS[i][1] - PTS[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
        d += " L " + PTS[i][0] + " " + PTS[i][1];
      }
      var LEN = cum[cum.length - 1];

      var trace = document.getElementById("f47-trace");
      var ghost = document.getElementById("f47-ghost");
      var spark = document.getElementById("f47-spark");
      trace.setAttribute("d", d);
      ghost.setAttribute("d", d);
      trace.setAttribute("stroke-dasharray", LEN + " " + LEN);
      trace.setAttribute("stroke-dashoffset", LEN);

      // courier spark rides the head of the numeral trail (pure function of progress → seek-safe)
      var travel = { p: 0 };
      function renderSpark() {
        var dist = Math.max(0, Math.min(1, travel.p)) * LEN;
        var k = 1;
        while (k < cum.length - 1 && cum[k] < dist) k++;
        var p0 = PTS[k - 1], p1 = PTS[k];
        var seg = cum[k] - cum[k - 1];
        var t = seg > 0 ? (dist - cum[k - 1]) / seg : 0;
        var x = p0[0] + (p1[0] - p0[0]) * t;
        var y = p0[1] + (p1[1] - p0[1]) * t;
        var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
        spark.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      }
      renderSpark();

      // underline trail: fixed length bound (≥ true curve length) keeps it deterministic
      var ULEN = 740;
      var under = document.getElementById("f47-under-path");
      under.setAttribute("stroke-dasharray", ULEN + " " + ULEN);
      under.setAttribute("stroke-dashoffset", ULEN);

      gsap.set([spark, ghost, "#f47-kicker", "#f47-bloom"], { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.32 s) — "Chương sáu": hue shifts +12°, the trail writes a large "6"
      tl.fromTo("#f47-glow-prev", { opacity: 1 }, { opacity: 0, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f47-glow-ch", { opacity: 0 }, { opacity: 1, duration: 1.25, ease: "power2.inOut" }, 0);
      tl.fromTo("#f47-decor", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#f47-ring-spin", { rotation: 0 }, { rotation: -24, duration: DUR - 0.05, ease: "none" }, 0.05);
      tl.fromTo(trace, { attr: { "stroke-dashoffset": LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "none" }, 0.1);
      tl.fromTo(travel, { p: 0 }, { p: 1, duration: 1.1, ease: "none", onUpdate: renderSpark }, 0.1);
      tl.fromTo(spark, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.1);
      // "sáu" @ 1.02 — the written 6 gains body and blooms as the trail closes
      tl.fromTo(ghost, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.02);
      tl.fromTo("#f47-bloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.02);
      tl.to(spark, { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 1.22);

      // Scene 2 (1.32–3.56 s) — numeral settles left, "Nâng cao" lands on cue, subtitle slides up under it
      tl.fromTo("#f47-numeral", { x: 260, scale: 1.1 }, { x: 0, scale: 0.92, duration: 0.55, ease: "power2.inOut" }, 1.32);
      tl.fromTo("#f47-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.45);
      // cues: "nâng" @ 1.69, "cao" @ 1.85
      tl.fromTo("#f47-w1", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.67);
      tl.fromTo("#f47-w2", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.83);
      // audio_meta: "những" 2.153, "điểm" 2.335, "nổi" 2.517, "bật" 2.658
      tl.fromTo("#f47-s1", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.14);
      tl.fromTo("#f47-s2", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.32);
      tl.fromTo("#f47-s3", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.5);
      tl.fromTo("#f47-s4", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.64);
      // the courier trail underlines the chapter title
      tl.fromTo(under, { attr: { "stroke-dashoffset": ULEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "none" }, 2.75);

      // hold: a quiet ~1% drift only
      tl.fromTo("#f47-cam", { scale: 1 }, { scale: 1.01, duration: DUR - 3.05, ease: "none" }, 3.05);

      tl.to({}, { duration: DUR }, 0); // full-span anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["47-nang-cao-nhung-diem-noi-bat"] = tl;
    })();
